<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>StarGame - 100 Produits | Firebase Auth</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1a2e, #0a0f24, #0a1927);
            min-height: 100vh;
            color: #f0f3fa;
            padding-bottom: 30px;
        }
        .container { max-width: 100%; padding: 12px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            padding: 10px 15px;
            border-radius: 28px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid rgba(255,200,50,0.5);
        }
        .logo h1 { font-size: 1.2em; background: linear-gradient(135deg, #FFD966, #FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .balance, .username {
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75em;
            background: rgba(0,0,0,0.5);
        }
        .balance { background: linear-gradient(135deg, #2ecc71, #1e8e4a); }
        .username { background: #2c3e8f; }
        .deposit-btn, .withdraw-btn, .logout-btn, .support-btn {
            border: none;
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.7em;
            cursor: pointer;
        }
        .deposit-btn { background: #1abc9c; color: white; }
        .withdraw-btn { background: #e67e22; color: white; }
        .logout-btn { background: #c0392b; color: white; }
        .support-btn { background: #25D366; color: white; }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8em;
        }
        .tab-btn.active { background: #f39c12; color: #0a0f24; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        .product-card {
            background: rgba(25,35,55,0.8);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            padding: 10px 6px;
            text-align: center;
            border: 1px solid rgba(255,200,80,0.3);
        }
        .product-emoji { font-size: 32px; }
        .product-name { font-size: 0.8em; font-weight: bold; }
        .product-category { font-size: 0.6em; background: rgba(0,0,0,0.4); display: inline-block; padding: 2px 8px; border-radius: 30px; margin: 4px 0; }
        .product-price { font-size: 0.9em; font-weight: bold; color: #FFD966; }
        .buy-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border: none;
            padding: 6px 10px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            width: 95%;
            font-size: 0.7em;
        }
        .inventory-item {
            background: rgba(25,40,55,0.85);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 5px solid #f39c12;
        }
        .timer-active {
            background: rgba(46,204,113,0.25);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 0.65em;
            font-weight: bold;
            display: inline-block;
        }
        .play-game-btn {
            background: #e67e22;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75em;
        }
        .search-bar { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-bar input { flex: 1; padding: 8px 12px; border-radius: 50px; border: none; background: rgba(255,255,255,0.1); color: white; }
        .search-bar select { padding: 8px 12px; border-radius: 50px; background: rgba(255,255,255,0.15); color: white; border: none; }
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 15px; }
        .page-btn { background: rgba(255,255,255,0.2); border: none; padding: 4px 10px; border-radius: 30px; cursor: pointer; color: white; font-size: 0.7em; }
        .page-btn.active { background: #f39c12; color: #0a0f24; }
        .message {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            z-index: 2000;
            font-weight: bold;
        }
        .message-success { background: #27ae60; }
        .message-error { background: #e74c3c; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: linear-gradient(145deg, #1e2a3a, #0f1722);
            padding: 25px;
            border-radius: 36px;
            max-width: 90%;
            width: 380px;
            text-align: center;
            border: 1px solid #f39c12;
        }
        .modal-content h2 { color: #ffd966; margin-bottom: 18px; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
        }
        .modal-content select option { background: #1e2a3a; }
        .confirm-btn, .close-modal { padding: 8px 20px; border-radius: 50px; margin: 5px; font-weight: bold; cursor: pointer; border: none; }
        .confirm-btn { background: #2ecc71; color: white; }
        .close-modal { background: #e74c3c; color: white; }
        .flag-container { display: flex; justify-content: center; gap: 10px; margin: 12px 0; }
        .flag-img { width: 90px; height: 60px; object-fit: cover; border-radius: 12px; border: 2px solid gold; }
        .quiz-option {
            background: rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 10px;
            margin: 8px 0;
            cursor: pointer;
        }
        .quiz-option.selected { background: #f39c12; color: #1e2a3a; font-weight: bold; }
        .game-stats { font-size: 0.75rem; margin-bottom: 8px; color: #ffd966; }
        .loading { text-align: center; padding: 40px; }
        .phone-hint { font-size: 0.65em; color: #ffaa66; margin-top: -5px; margin-bottom: 8px; text-align: left; }
        @media (min-width: 640px) { .products-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
    </style>
</head>
<body>
<div id="app"></div>

<!-- MODALE AUTH -->
<div id="authModal" class="modal active">
    <div class="modal-content">
        <h2 id="authTitle">🔐 STAR GAME</h2>
        <div id="loginForm">
            <input type="tel" id="loginPhone" placeholder="📞 Numéro (8 chiffres)">
            <input type="password" id="loginPassword" placeholder="🔒 Mot de passe">
            <button class="confirm-btn" onclick="window.login()">Se connecter</button>
        </div>
        <div id="signupForm" style="display:none;">
            <input type="text" id="signupName" placeholder="👤 Nom d'utilisateur">
            <input type="tel" id="signupPhone" placeholder="📞 Numéro (8 chiffres)">
            <select id="signupCountry">
                <option value="">🌍 Choisissez votre pays</option>
                <option value="Niger">🇳🇪 Niger</option>
                <option value="France">🇫🇷 France</option>
                <option value="Sénégal">🇸🇳 Sénégal</option>
                <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
                <option value="Cameroun">🇨🇲 Cameroun</option>
                <option value="Maroc">🇲🇦 Maroc</option>
                <option value="Algérie">🇩🇿 Algérie</option>
                <option value="Tunisie">🇹🇳 Tunisie</option>
                <option value="RDC">🇨🇩 RDC</option>
                <option value="Nigéria">🇳🇬 Nigéria</option>
                <option value="Mali">🇲🇱 Mali</option>
                <option value="Burkina Faso">🇧🇫 Burkina Faso</option>
            </select>
            <input type="password" id="signupPassword" placeholder="🔒 Mot de passe (8 caractères)">
            <div class="phone-hint">⚠️ Mot de passe: 8 caractères (ex: abcd1234)</div>
            <button class="confirm-btn" onclick="window.signup()">S'inscrire</button>
        </div>
        <div class="switch-auth" style="margin-top:12px;color:#f39c12;cursor:pointer;" onclick="window.toggleAuthMode()">
            <span id="switchText">🔄 Pas de compte ? S'inscrire</span>
        </div>
    </div>
</div>

<div id="gameModal" class="modal">
    <div class="modal-content">
        <h2>🎲 JEU DES DRAPEAUX</h2>
        <p style="font-size:0.7rem;">💰 500 CFA pour jouer → Gagnez 45% | Perdez → 10%</p>
        <div id="GameQuizContainer"></div>
        <div id="gameResultArea" style="display:none;"></div>
        <button class="close-modal" onclick="window.closeGameModal()">Fermer</button>
    </div>
</div>

<div id="depositModal" class="modal">
    <div class="modal-content">
        <h2>💰 DÉPÔT</h2>
        <p>📲 Envoyez à <strong>97413067</strong> (AMANATA)</p>
        <input type="number" id="depositAmount" placeholder="Montant ≥1000 CFA">
        <input type="text" id="depositCode" placeholder="Code transaction">
        <button class="confirm-btn" onclick="window.submitDeposit()">Valider</button>
        <button class="close-modal" onclick="window.closeDepositModal()">Annuler</button>
    </div>
</div>

<div id="withdrawModal" class="modal">
    <div class="modal-content">
        <h2>💸 RETRAIT</h2>
        <p>Min 3000 - Max 50000 CFA</p>
        <input type="number" id="withdrawAmount" placeholder="Montant">
        <button class="confirm-btn" onclick="window.submitWithdraw()">Demander</button>
        <button class="close-modal" onclick="window.closeWithdrawModal()">Fermer</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCxsXpj3ovdd2Wu5HNHN1Zyvf7qG00aXx4",
        authDomain: "dubai-dbd3f.firebaseapp.com",
        databaseURL: "https://dubai-dbd3f-default-rtdb.firebaseio.com",
        projectId: "dubai-dbd3f",
        storageBucket: "dubai-dbd3f.firebasestorage.app",
        messagingSenderId: "543622740538",
        appId: "1:543622740538:web:0e4e6abf3124a878dad303",
        measurementId: "G-3R4KW05TQ4"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    
    let currentUser = null;
    let currentUserData = null;
    let products = [];
    let userInventory = [];
    let currentTab = 'market';
    let searchTerm = '';
    let selectedCategory = '';
    let currentPage = 1;
    const itemsPerPage = 24;
    const MAX_PRODUCT_PRICE = 5000;
    const SUPPORT_PHONE = "97413067";
    
    let activeGameItem = null;
    let gameQuestions = [], gameAnswers = [], gameIndex = 0, gameActive = false;
    let onGameComplete = null;
    
    function playSound(type) {
        try {
            let audio = new Audio();
            if (type === 'win') audio = new Audio("https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3");
            else if (type === 'lose') audio = new Audio("https://www.soundjay.com/misc/sounds/failure-drum.mp3");
            else if (type === 'click') audio = new Audio("https://www.soundjay.com/misc/sounds/button-click.mp3");
            audio.volume = 0.4;
            audio.play().catch(() => {});
        } catch(e) {}
    }
    
    const ALL_COUNTRIES = [
        { name: "Niger", emoji: "🇳🇪", code: "ne" }, { name: "France", emoji: "🇫🇷", code: "fr" },
        { name: "Sénégal", emoji: "🇸🇳", code: "sn" }, { name: "Côte d'Ivoire", emoji: "🇨🇮", code: "ci" },
        { name: "Cameroun", emoji: "🇨🇲", code: "cm" }, { name: "Maroc", emoji: "🇲🇦", code: "ma" },
        { name: "Algérie", emoji: "🇩🇿", code: "dz" }, { name: "Tunisie", emoji: "🇹🇳", code: "tn" }
    ];
    
    function generateGameQuestions() {
        const shuffled = [...ALL_COUNTRIES].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 10);
        return selected.map(item => {
            const wrongs = ALL_COUNTRIES.filter(c => c.name !== item.name).sort(() => 0.5 - Math.random()).slice(0, 3);
            const options = [item.name, ...wrongs.map(w => w.name)];
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            return { name: item.name, emoji: item.emoji, flagUrl: `https://flagcdn.com/w120/${item.code}.png`, correctAnswer: item.name, options };
        });
    }
    
    function generateProductList() {
        const categories = ["Or", "Diamant", "Montre", "Smartphone", "PC", "Console", "Casque", "Crypto", "Immobilier", "Bourse", "Voiture", "Moto", "Avion", "Yacht", "Art", "NFT", "Sac", "Chaussures", "Parfum", "Montre Luxe"];
        const emojis = { "Or":"🪙","Diamant":"💎","Montre":"⌚","Smartphone":"📱","PC":"💻","Console":"🎮","Casque":"🎧","Crypto":"₿","Immobilier":"🏠","Bourse":"📈","Voiture":"🚗","Moto":"🏍️","Avion":"✈️","Yacht":"⛵","Art":"🎨","NFT":"🖼️","Sac":"👜","Chaussures":"👟","Parfum":"🧴","Montre Luxe":"⌚"};
        let list = [];
        const pricesList = [500, 800, 1000, 1200, 1500, 1800, 2000, 2500, 3000, 3500, 4000, 4500, 5000];
        for (let i = 0; i < 100; i++) {
            let cat = categories[i % categories.length];
            let productNum = Math.floor(i / categories.length) + 1;
            let price = pricesList[i % pricesList.length];
            list.push({ id: i + 1, name: `${cat} ${productNum}`, category: cat, emoji: emojis[cat] || "📦", currentPrice: price, isAvailable: true, ownerId: null });
        }
        return list;
    }
    
    async function processDailyEarnings() {
        if (!currentUserData) return;
        const now = new Date();
        let updated = false;
        for (let inv of userInventory) {
            if (!inv.dailyClaimed) inv.dailyClaimed = [];
            if (inv.gainDaysLeft === undefined) inv.gainDaysLeft = 3;
            if (inv.gainDaysLeft <= 0) continue;
            const purchaseDate = new Date(inv.purchaseDate);
            const dayIndex = Math.floor((now - purchaseDate) / (1000*60*60*24));
            if (dayIndex >= 1 && dayIndex <= 3 && !inv.dailyClaimed.includes(dayIndex)) {
                const reward = Math.floor(inv.purchasePrice * 0.45);
                currentUserData.balance += reward;
                inv.dailyClaimed.push(dayIndex);
                inv.gainDaysLeft--;
                updated = true;
                await database.ref(`inventory/${currentUser.uid}/${inv.id}`).update({ dailyClaimed: inv.dailyClaimed, gainDaysLeft: inv.gainDaysLeft });
                await database.ref(`users/${currentUser.uid}`).update({ balance: currentUserData.balance });
                showMessage(`✨ ${inv.productName} : +${reward.toLocaleString()} CFA`, "success");
            }
        }
        if (updated) renderApp();
    }
    
    async function buyProduct(productId) {
        playSound('click');
        if (!currentUserData) return;
        const snap = await database.ref('products').once('value');
        let allProducts = [];
        const snapVal = snap.val();
        if (snapVal) allProducts = Array.isArray(snapVal) ? snapVal : Object.values(snapVal);
        const product = allProducts.find(p => p.id === productId);
        if (!product || !product.isAvailable) { showMessage("Produit indisponible", "error"); return; }
        if (currentUserData.balance < product.currentPrice) { showMessage("Solde insuffisant", "error"); return; }
        
        currentUserData.balance -= product.currentPrice;
        await database.ref(`users/${currentUser.uid}`).update({ balance: currentUserData.balance });
        
        const updatedProducts = allProducts.map(p => p.id === productId ? { ...p, isAvailable: false, ownerId: currentUser.uid } : p);
        await database.ref('products').set(updatedProducts);
        
        const newItem = {
            id: Date.now(),
            productId: product.id,
            productName: product.name,
            productEmoji: product.emoji,
            purchasePrice: product.currentPrice,
            purchaseDate: new Date().toISOString(),
            gainDaysLeft: 3,
            dailyClaimed: [],
        };
        await database.ref(`inventory/${currentUser.uid}`).push(newItem);
        showMessage(`✅ Achat réussi ! ${product.name} retiré du marché.`, "success");
        await refreshUserInventory();
        renderApp();
    }
    
    async function playGameForItem(itemId) {
        playSound('click');
        const item = userInventory.find(i => i.id === itemId);
        if (!item) { showMessage("Produit non trouvé", "error"); return; }
        if (item.gainDaysLeft <= 0) { showMessage("Plus de jours de gain", "error"); return; }
        if (currentUserData.balance < 500) { showMessage("500 CFA requis", "error"); return; }
        
        currentUserData.balance -= 500;
        await database.ref(`users/${currentUser.uid}`).update({ balance: currentUserData.balance });
        
        activeGameItem = item;
        gameQuestions = generateGameQuestions();
        gameAnswers = [];
        gameIndex = 0;
        gameActive = true;
        
        onGameComplete = async (isWin) => {
            const reward = isWin ? Math.floor(item.purchasePrice * 0.45) : Math.floor(item.purchasePrice * 0.10);
            currentUserData.balance += reward;
            if (isWin) playSound('win'); else playSound('lose');
            
            const now = new Date();
            const purchaseDate = new Date(item.purchaseDate);
            const dayIndex = Math.floor((now - purchaseDate) / (1000*60*60*24));
            if (!item.dailyClaimed) item.dailyClaimed = [];
            if (dayIndex >= 1 && dayIndex <= 3 && !item.dailyClaimed.includes(dayIndex)) {
                item.dailyClaimed.push(dayIndex);
                item.gainDaysLeft--;
                await database.ref(`inventory/${currentUser.uid}/${item.id}`).update({ dailyClaimed: item.dailyClaimed, gainDaysLeft: item.gainDaysLeft });
            }
            await database.ref(`users/${currentUser.uid}`).update({ balance: currentUserData.balance });
            showMessage(isWin ? `🏆 VICTOIRE ! +${reward.toLocaleString()} CFA` : `😞 Perdu... +${reward.toLocaleString()} CFA`, isWin ? "success" : "info");
            renderApp();
        };
        renderGameModal();
        document.getElementById('gameModal').classList.add('active');
    }
    
    function renderGameModal() {
        const container = document.getElementById('GameQuizContainer');
        const resultDiv = document.getElementById('gameResultArea');
        resultDiv.style.display = 'none';
        if (!gameActive || gameIndex >= gameQuestions.length) {
            const allCorrect = gameAnswers.length === 10 && gameAnswers.every((a, i) => a === gameQuestions[i].correctAnswer);
            if (onGameComplete) onGameComplete(allCorrect);
            resultDiv.innerHTML = allCorrect ? '<div style="color:#2ecc71;">🏆 VICTOIRE ! 45% ajouté</div>' : '<div style="color:#e67e22;">🔻 Défaite... 10% ajouté</div>';
            resultDiv.style.display = "block";
            gameActive = false;
            setTimeout(() => { document.getElementById('gameModal').classList.remove('active'); onGameComplete = null; }, 2000);
            return;
        }
        const q = gameQuestions[gameIndex];
        const selected = gameAnswers[gameIndex] || null;
        container.innerHTML = `
            <div class="game-stats">🎯 Question ${gameIndex+1}/10</div>
            <div class="flag-container"><img class="flag-img" src="${q.flagUrl}" onerror="this.style.display='none'"><span style="font-size:2rem;">${q.emoji}</span></div>
            <div style="margin:8px 0;">De quel pays est ce drapeau ?</div>
            ${q.options.map(opt => `<div class="quiz-option ${selected === opt ? 'selected' : ''}" onclick="window.selectGameAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</div>`).join('')}
            <div style="margin:15px 0;">${gameIndex>0?`<button class="confirm-btn" onclick="window.prevGame()" style="background:#e67e22;">◀ Préc</button>`:''}<button class="confirm-btn" onclick="window.nextGame()">Suivant ▶</button></div>
        `;
    }
    
    function selectGameAnswer(ans) { if(gameActive) { gameAnswers[gameIndex] = ans; renderGameModal(); } }
    function nextGame() { if(gameActive && gameAnswers[gameIndex] && gameIndex+1 <= gameQuestions.length) { gameIndex++; renderGameModal(); } }
    function prevGame() { if(gameActive && gameIndex>0) { gameIndex--; renderGameModal(); } }
    function closeGameModal() { document.getElementById('gameModal').classList.remove('active'); gameActive = false; onGameComplete = null; renderApp(); }
    
    async function refreshUserInventory() {
        const snap = await database.ref(`inventory/${currentUser.uid}`).once('value');
        userInventory = snap.exists() ? Object.values(snap.val()) : [];
    }
    
    async function submitDeposit() {
        if (!currentUser) return;
        const amount = parseInt(document.getElementById('depositAmount').value);
        const code = document.getElementById('depositCode').value.trim();
        if (!amount || amount < 1000) { showMessage("Min 1000 CFA", "error"); return; }
        if (!code) { showMessage("Code requis", "error"); return; }
        await database.ref('deposits').push({ userId: currentUser.uid, username: currentUserData.username, phone: currentUserData.phone, amount, transferCode: code, status: 'pending', date: new Date().toISOString() });
        showMessage(`✅ Demande de dépôt envoyée !`, "success");
        closeDepositModal();
    }
    
    async function submitWithdraw() {
        if (!currentUser) return;
        const amount = parseInt(document.getElementById('withdrawAmount').value);
        if (!amount || amount < 3000) { showMessage("Min 3000 CFA", "error"); return; }
        if (amount > 50000) { showMessage("Max 50000 CFA", "error"); return; }
        if (amount > currentUserData.balance) { showMessage("Solde insuffisant", "error"); return; }
        await database.ref('withdraws').push({ userId: currentUser.uid, username: currentUserData.username, phone: currentUserData.phone, amount, status: 'pending', date: new Date().toISOString() });
        showMessage(`✅ Demande de retrait envoyée !`, "success");
        closeWithdrawModal();
    }
    
    function contactSupport() { window.location.href = `tel:${SUPPORT_PHONE}`; }
    function openDepositModal() { document.getElementById('depositModal').classList.add('active'); }
    function closeDepositModal() { document.getElementById('depositModal').classList.remove('active'); document.getElementById('depositAmount').value = ''; document.getElementById('depositCode').value = ''; }
    function openWithdrawModal() { document.getElementById('withdrawModal').classList.add('active'); }
    function closeWithdrawModal() { document.getElementById('withdrawModal').classList.remove('active'); document.getElementById('withdrawAmount').value = ''; }
    
    function renderApp() {
        if (!currentUserData) return;
        let available = products.filter(p => p.isAvailable === true && p.currentPrice <= MAX_PRODUCT_PRICE);
        if (searchTerm) available = available.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));
        if (selectedCategory && selectedCategory !== 'all') available = available.filter(p => p.category === selectedCategory);
        const totalPages = Math.ceil(available.length / itemsPerPage);
        const paginated = available.slice((currentPage-1)*itemsPerPage, currentPage*itemsPerPage);
        const allCats = [...new Set(products.map(p=>p.category))];
        let content = `<div class="container"><div class="header"><div class="logo"><h1>🎲 STAR GAME 45%</h1><p>📦 100 produits</p></div><div class="user-info"><span class="username">👤 ${currentUserData.username}</span><span class="balance">💰 ${currentUserData.balance.toLocaleString()} CFA</span><button class="support-btn" onclick="window.contactSupport()">📞 ${SUPPORT_PHONE}</button><button class="deposit-btn" onclick="window.openDepositModal()">➕ Dépôt</button><button class="withdraw-btn" onclick="window.openWithdrawModal()">💸 Retrait</button><button class="logout-btn" onclick="window.logout()">🚪 Exit</button></div></div>
        <div class="tabs"><button class="tab-btn ${currentTab==='market'?'active':''}" onclick="window.switchTab('market')">🛍️ Marché (${available.length})</button><button class="tab-btn ${currentTab==='inventory'?'active':''}" onclick="window.switchTab('inventory')">📦 Mes produits (${userInventory.length})</button></div>`;
        if (currentTab === 'market') {
            content += `<div class="search-bar"><input id="searchInput" placeholder="🔍 Rechercher" value="${searchTerm}" onkeyup="window.updateSearch(this.value)"><select id="catSelect" onchange="window.updateCategory(this.value)"><option value="all">Toutes</option>${allCats.map(c=>`<option value="${c}" ${selectedCategory===c?'selected':''}>${c}</option>`).join('')}</select></div>
            <div class="products-grid">${paginated.map(p => `<div class="product-card"><div class="product-emoji">${p.emoji}</div><div class="product-name">${p.name}</div><div class="product-category">${p.category}</div><div class="product-price">${p.currentPrice.toLocaleString()} CFA</div><button class="buy-btn" onclick="window.buyProduct(${p.id})">✔️ Acheter</button></div>`).join('')}</div>
            ${totalPages>1?`<div class="pagination">${Array.from({length:Math.min(totalPages,6)},(_,i)=>i+1).map(p=>`<button class="page-btn ${p===currentPage?'active':''}" onclick="window.goToPage(${p})">${p}</button>`).join('')}</div>`:''}`;
        } else {
            if (userInventory.length === 0) content += `<div class="loading">🌟 Aucun produit acheté.</div>`;
            else userInventory.forEach(item => {
                const daysLeft = item.gainDaysLeft || 0;
                const claimedCount = (item.dailyClaimed || []).length;
                content += `<div class="inventory-item"><div><strong>${item.productEmoji} ${item.productName}</strong><div class="product-detail">💰 ${item.purchasePrice.toLocaleString()} CFA</div><div class="timer-active">⏳ ${daysLeft} jour(s) restants (${claimedCount}/3)</div></div><div>${daysLeft > 0 ? `<button class="play-game-btn" onclick="window.playGameForItem(${item.id})">🎮 Jouer (500 CFA)</button>` : `<span style="background:#2c3e50; padding:8px 15px; border-radius:30px;">✅ Terminé</span>`}</div></div>`;
            });
        }
        content += `</div>`; document.getElementById('app').innerHTML = content;
    }
    
    function startApp() {
        database.ref('products').once('value', (snap) => { if (!snap.exists()) database.ref('products').set(generateProductList()); });
        database.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            products = data ? (Array.isArray(data) ? data : Object.values(data)).filter(p => p.isAvailable === true) : [];
            renderApp();
        });
        database.ref(`inventory/${currentUser.uid}`).on('value', async (snapInv) => {
            userInventory = snapInv.exists() ? Object.values(snapInv.val()) : [];
            await processDailyEarnings();
            renderApp();
        });
        setInterval(() => { if(currentUserData) processDailyEarnings(); }, 60000);
        renderApp();
    }
    
    // ========== AUTHENTIFICATION FIREBASE ==========
    async function login() {
        let phone = document.getElementById('loginPhone').value.trim();
        let password = document.getElementById('loginPassword').value;
        
        if (!phone || phone.length !== 8) { showMessage("Numéro à 8 chiffres", "error"); return; }
        if (!password) { showMessage("Mot de passe requis", "error"); return; }
        
        const email = `${phone}@stargame.com`;
        
        try {
            const result = await auth.signInWithEmailAndPassword(email, password);
            currentUser = result.user;
            await loadUserData();
            document.getElementById('authModal').classList.remove('active');
            startApp();
            showMessage(`✅ Bonjour ${currentUserData.username} !`, "success");
        } catch(error) {
            if (error.code === 'auth/user-not-found') {
                showMessage("Compte non trouvé. Inscrivez-vous d'abord.", "error");
            } else if (error.code === 'auth/wrong-password') {
                showMessage("Mot de passe incorrect", "error");
            } else {
                showMessage("Erreur: " + error.message, "error");
            }
        }
    }
    
    async function signup() {
        let name = document.getElementById('signupName').value.trim();
        let phone = document.getElementById('signupPhone').value.trim();
        let country = document.getElementById('signupCountry').value;
        let password = document.getElementById('signupPassword').value;
        
        if (!name || name.length < 3) { showMessage("Nom (min 3 caractères)", "error"); return; }
        if (!phone || !/^\d{8}$/.test(phone)) { showMessage("Numéro à 8 chiffres", "error"); return; }
        if (!country) { showMessage("Choisissez votre pays", "error"); return; }
        if (!password || password.length !== 8 || !/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8}$/.test(password)) {
            showMessage("Mot de passe: 8 caractères avec lettres ET chiffres", "error");
            return;
        }
        
        const email = `${phone}@stargame.com`;
        
        try {
            const result = await auth.createUserWithEmailAndPassword(email, password);
            currentUser = result.user;
            
            // Créer l'utilisateur dans la base de données
            await database.ref(`users/${currentUser.uid}`).set({
                username: name,
                phone: phone,
                country: country,
                balance: 5000,
                createdAt: new Date().toISOString()
            });
            
            currentUserData = { username: name, phone: phone, country: country, balance: 5000 };
            document.getElementById('authModal').classList.remove('active');
            startApp();
            showMessage(`✅ Inscription réussie ! 5000 CFA offerts`, "success");
        } catch(error) {
            if (error.code === 'auth/email-already-in-use') {
                showMessage("Ce numéro est déjà utilisé", "error");
            } else {
                showMessage("Erreur: " + error.message, "error");
            }
        }
    }
    
    async function loadUserData() {
        const snap = await database.ref(`users/${currentUser.uid}`).once('value');
        if (snap.exists()) {
            currentUserData = snap.val();
        } else {
            showMessage("Erreur chargement données", "error");
        }
    }
    
    function toggleAuthMode() {
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const switchText = document.getElementById('switchText');
        if (loginForm.style.display !== 'none') {
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            switchText.innerText = '🔄 Déjà un compte ? Se connecter';
        } else {
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            switchText.innerText = '🔄 Pas de compte ? S\'inscrire';
        }
    }
    
    async function logout() {
        await auth.signOut();
        currentUser = null;
        currentUserData = null;
        document.getElementById('authModal').classList.add('active');
        document.getElementById('app').innerHTML = '';
        toggleAuthMode();
    }
    
    function showMessage(msg, type) {
        let div = document.createElement('div');
        div.className = `message message-${type}`;
        div.innerText = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }
    
    window.login = login;
    window.signup = signup;
    window.toggleAuthMode = toggleAuthMode;
    window.buyProduct = buyProduct;
    window.playGameForItem = playGameForItem;
    window.selectGameAnswer = selectGameAnswer;
    window.nextGame = nextGame;
    window.prevGame = prevGame;
    window.closeGameModal = closeGameModal;
    window.switchTab = (t) => { currentTab = t; currentPage = 1; renderApp(); };
    window.updateSearch = (v) => { searchTerm = v; currentPage = 1; renderApp(); };
    window.updateCategory = (c) => { selectedCategory = c; currentPage = 1; renderApp(); };
    window.goToPage = (p) => { currentPage = p; renderApp(); };
    window.openDepositModal = openDepositModal;
    window.closeDepositModal = closeDepositModal;
    window.openWithdrawModal = openWithdrawModal;
    window.closeWithdrawModal = closeWithdrawModal;
    window.submitDeposit = submitDeposit;
    window.submitWithdraw = submitWithdraw;
    window.contactSupport = contactSupport;
    window.logout = logout;
    
    // Vérifier session existante
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            await loadUserData();
            if (currentUserData) {
                document.getElementById('authModal').classList.remove('active');
                startApp();
            }
        }
    });
</script>
</body>
</html>
