<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Trading Game Pro - Marché + Quiz Drapeaux</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            padding-bottom: 20px;
        }

        .container {
            max-width: 100%;
            padding: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .logo h1 {
            font-size: 1.2em;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            font-size: 0.65em;
            opacity: 0.8;
        }

        .user-info {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .balance, .username {
            padding: 4px 10px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.75em;
        }
        .balance { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .username { background: #3498db; }

        .deposit-btn, .withdraw-btn, .whatsapp-btn, .quiz-btn {
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.7em;
            font-weight: bold;
        }
        .deposit-btn { background: #f39c12; }
        .withdraw-btn { background: #e74c3c; }
        .whatsapp-btn { background: #25D366; }
        .quiz-btn { background: #9b59b6; }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: 600;
        }
        .tab-btn.active {
            background: #ffd700;
            color: #1e3c72;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .product-card {
            background: rgba(20,20,40,0.7);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .product-emoji { font-size: 32px; margin-bottom: 4px; }
        .product-name { font-size: 0.8em; font-weight: bold; white-space: nowrap; overflow-x: hidden; text-overflow: ellipsis; }
        .product-category { font-size: 0.6em; opacity: 0.7; background: rgba(0,0,0,0.3); display: inline-block; padding: 2px 8px; border-radius: 20px; margin: 4px 0; }
        .product-price { font-size: 1em; font-weight: bold; color: #ffd700; margin: 5px 0; }
        .price-variation { font-size: 0.65em; margin: 3px 0; }
        .price-up { color: #2ecc71; }
        .price-down { color: #e74c3c; }
        .buy-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.7em;
            font-weight: bold;
            width: 90%;
            margin-top: 5px;
        }

        .inventory-item, .listing-card {
            background: rgba(30,30,55,0.8);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-left: 4px solid #ffd700;
        }
        .inventory-item h4, .listing-card h4 { font-size: 0.85em; }
        .inventory-item p, .listing-card p { font-size: 0.7em; }
        .set-price-input {
            padding: 6px 8px;
            border-radius: 30px;
            border: none;
            width: 100px;
            background: #2c2c44;
            color: white;
            font-size: 0.7em;
        }
        .sell-btn {
            background: #e67e22;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.7em;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 30px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 0.8em;
        }
        .search-bar select {
            padding: 8px 12px;
            border-radius: 30px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 0.75em;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            color: white;
            font-size: 0.7em;
            cursor: pointer;
        }
        .page-btn.active {
            background: #ffd700;
            color: #1e3c72;
        }

        .message {
            position: fixed;
            bottom: 15px;
            right: 15px;
            left: 15px;
            padding: 10px;
            border-radius: 30px;
            text-align: center;
            z-index: 2000;
            font-size: 0.8em;
            font-weight: bold;
        }
        .message-success { background: #2ecc71; }
        .message-error { background: #e74c3c; }
        .message-info { background: #3498db; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: linear-gradient(145deg, #1e1e32, #12121f);
            padding: 20px;
            border-radius: 24px;
            max-width: 90%;
            width: 350px;
            text-align: center;
            border: 1px solid #ffd700;
        }
        .modal-content h2 { font-size: 1.2em; margin-bottom: 15px; color: #ffd700; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 30px;
            border: none;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 0.85em;
        }
        .confirm-btn, .close-modal {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            margin: 8px 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .confirm-btn { background: #2ecc71; color: white; }
        .close-modal { background: #e74c3c; color: white; }

        /* Styles du Quiz avec drapeaux en image */
        .quiz-question { margin: 10px 0; }
        .flag-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }
        .flag-emoji {
            font-size: 5rem;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 10px;
            display: inline-block;
        }
        .flag-img {
            width: 100px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #ffd700;
        }
        .quiz-option {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 30px;
            padding: 8px;
            margin: 6px 0;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }
        .quiz-option:hover { background: rgba(255,215,0,0.3); transform: scale(1.02); }
        .quiz-option.selected { background: #ffd700; color: #1e3c72; font-weight: bold; border-color: #ffd700; }
        .quiz-progress { font-size: 0.8em; margin-bottom: 8px; color: #ffd700; }
        .quiz-result { font-size: 0.9em; margin-top: 10px; padding: 10px; border-radius: 16px; }
        .quiz-result.success { background: #2ecc71; }
        .quiz-result.fail { background: #e74c3c; }
        
        .loading { text-align: center; padding: 40px; font-size: 0.9em; }
        .error-message { background: #e74c3c; padding: 15px; border-radius: 16px; margin: 15px; text-align: center; font-size: 0.8em; }
        
        @media (min-width: 600px) {
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
            .container { max-width: 100%; padding: 15px; }
            .flag-img { width: 120px; height: 80px; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- MODALE INSCRIPTION -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2>📝 INSCRIPTION</h2>
            <input type="text" id="registerUsername" placeholder="👤 Pseudo">
            <input type="tel" id="registerPhone" placeholder="📞 Téléphone">
            <button class="confirm-btn" onclick="window.registerOrLogin()">🎮 Commencer</button>
        </div>
    </div>

    <!-- MODALE QUIZ DRAPEAUX -->
    <div id="quizModal" class="modal">
        <div class="modal-content">
            <h2>🏆 QUIZ DRAPEAUX 🏆</h2>
            <p style="font-size:0.75em; margin-bottom:10px;">💰 100 FCFA | 10 questions | tout bon → remboursé</p>
            <div id="quizContainer"></div>
            <div id="quizResult" style="display:none;"></div>
            <button class="close-modal" onclick="window.closeQuizModal()">Fermer</button>
        </div>
    </div>

    <!-- MODALE DÉPÔT -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <h2>💰 DÉPÔT</h2>
            <p style="font-size:0.7em;">📌 Envoyez à: <strong>97413067</strong> (Amanata)</p>
            <input type="number" id="depositAmount" placeholder="Montant (min 1000)">
            <input type="text" id="depositCode" placeholder="Code d'envoi">
            <button class="confirm-btn" onclick="window.submitDeposit()">Valider</button>
            <button class="close-modal" onclick="window.closeDepositModal()">Fermer</button>
        </div>
    </div>

    <!-- MODALE RETRAIT -->
    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <h2>💸 RETRAIT</h2>
            <p style="font-size:0.7em;">3000 - 50000 CFA</p>
            <input type="number" id="withdrawAmount" placeholder="Montant">
            <button class="confirm-btn" onclick="window.submitWithdraw()">Demander</button>
            <button class="close-modal" onclick="window.closeWithdrawModal()">Annuler</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('app').innerHTML = '<div class="loading">🚀 Chargement...</div>';
            initApp();
        });

        async function initApp() {
            try {
                const firebaseModule = await import("https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js");
                const databaseModule = await import("https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js");
                
                const { initializeApp } = firebaseModule;
                const { getDatabase, ref, set, get, push, onValue, update, remove } = databaseModule;
                
                const firebaseConfig = {
                    apiKey: "AIzaSyCxsXpj3ovdd2Wu5HNHN1Zyvf7qG00aXx4",
                    authDomain: "dubai-dbd3f.firebaseapp.com",
                    databaseURL: "https://dubai-dbd3f-default-rtdb.firebaseio.com",
                    projectId: "dubai-dbd3f",
                    storageBucket: "dubai-dbd3f.firebasestorage.app",
                    messagingSenderId: "543622740538",
                    appId: "1:543622740538:web:0e4e6abf3124a878dad303"
                };
                
                const app = initializeApp(firebaseConfig);
                const db = getDatabase(app);
                
                window.db = db;
                window.ref = ref;
                window.set = set;
                window.get = get;
                window.push = push;
                window.onValue = onValue;
                window.update = update;
                window.remove = remove;
                
                startApp(db, ref, set, get, push, onValue, update, remove);
                
            } catch (error) {
                console.error(error);
                document.getElementById('app').innerHTML = `<div class="error-message">⚠️ Erreur: ${error.message}<br>Ouvrez sur un serveur HTTP</div>`;
            }
        }

        function startApp(db, ref, set, get, push, onValue, update, remove) {
            let currentUser = null;
            let products = [];
            let userInventory = [];
            let currentTab = 'market';
            let searchTerm = '';
            let selectedCategory = '';
            let currentPage = 1;
            const itemsPerPage = 20;
            
            let quizQuestions = [], quizAnswers = [], quizIndex = 0, quizActive = false;
            
            // Prix par paliers de 500 de 500 à 8000
            const FIXED_PRICES = [500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000, 6500, 7000, 7500, 8000];
            
            // Base de données des pays avec drapeaux (emoji + code pays pour image)
            const COUNTRIES = [
                { name: "France", emoji: "🇫🇷", code: "fr" },
                { name: "Allemagne", emoji: "🇩🇪", code: "de" },
                { name: "Espagne", emoji: "🇪🇸", code: "es" },
                { name: "Italie", emoji: "🇮🇹", code: "it" },
                { name: "Royaume-Uni", emoji: "🇬🇧", code: "gb" },
                { name: "États-Unis", emoji: "🇺🇸", code: "us" },
                { name: "Canada", emoji: "🇨🇦", code: "ca" },
                { name: "Brésil", emoji: "🇧🇷", code: "br" },
                { name: "Japon", emoji: "🇯🇵", code: "jp" },
                { name: "Chine", emoji: "🇨🇳", code: "cn" },
                { name: "Inde", emoji: "🇮🇳", code: "in" },
                { name: "Sénégal", emoji: "🇸🇳", code: "sn" },
                { name: "Maroc", emoji: "🇲🇦", code: "ma" },
                { name: "Tunisie", emoji: "🇹🇳", code: "tn" },
                { name: "Algérie", emoji: "🇩🇿", code: "dz" },
                { name: "Égypte", emoji: "🇪🇬", code: "eg" },
                { name: "Nigeria", emoji: "🇳🇬", code: "ng" },
                { name: "Côte d'Ivoire", emoji: "🇨🇮", code: "ci" },
                { name: "Cameroun", emoji: "🇨🇲", code: "cm" },
                { name: "Belgique", emoji: "🇧🇪", code: "be" },
                { name: "Suisse", emoji: "🇨🇭", code: "ch" },
                { name: "Pays-Bas", emoji: "🇳🇱", code: "nl" },
                { name: "Portugal", emoji: "🇵🇹", code: "pt" },
                { name: "Suède", emoji: "🇸🇪", code: "se" },
                { name: "Norvège", emoji: "🇳🇴", code: "no" },
                { name: "Danemark", emoji: "🇩🇰", code: "dk" },
                { name: "Finlande", emoji: "🇫🇮", code: "fi" },
                { name: "Pologne", emoji: "🇵🇱", code: "pl" },
                { name: "Grèce", emoji: "🇬🇷", code: "gr" },
                { name: "Turquie", emoji: "🇹🇷", code: "tr" },
                { name: "Russie", emoji: "🇷🇺", code: "ru" },
                { name: "Mexique", emoji: "🇲🇽", code: "mx" },
                { name: "Argentine", emoji: "🇦🇷", code: "ar" },
                { name: "Australie", emoji: "🇦🇺", code: "au" }
            ];
            
            // URL des images de drapeaux (CDN fiable)
            function getFlagUrl(countryCode) {
                return `https://flagcdn.com/w80/${countryCode}.png`;
            }
            
            function generateQuizQuestions() {
                const shuffled = [...COUNTRIES].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 10);
                return selected.map(item => {
                    const wrong = COUNTRIES.filter(c => c.name !== item.name).sort(() => 0.5 - Math.random()).slice(0, 3);
                    const options = [item.name, ...wrong.map(w => w.name)];
                    for (let i = options.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [options[i], options[j]] = [options[j], options[i]];
                    }
                    return {
                        name: item.name,
                        emoji: item.emoji,
                        code: item.code,
                        flagUrl: getFlagUrl(item.code),
                        correctAnswer: item.name,
                        options: options
                    };
                });
            }
            
            function generate30Products() {
                const categories = ["Or", "Diamants", "Voitures", "Motos", "Avions", "Montres", "Smartphones", "PC Gamer", "Immobilier", "Cryptos"];
                const emojis = { "Or": "🪙", "Diamants": "💎", "Voitures": "🚗", "Motos": "🏍️", "Avions": "✈️", "Montres": "⌚", "Smartphones": "📱", "PC Gamer": "💻", "Immobilier": "🏠", "Cryptos": "₿" };
                const productList = [];
                
                for (let i = 0; i < 30; i++) {
                    const category = categories[i % categories.length];
                    const price = FIXED_PRICES[i % FIXED_PRICES.length];
                    productList.push({
                        id: i + 1,
                        name: `${category} ${Math.floor(i / categories.length) + 1}`,
                        category: category,
                        emoji: emojis[category] || "📦",
                        currentPrice: price,
                        lastVariation: 0,
                        isAvailable: true,
                        ownerId: null,
                        ownerName: null
                    });
                }
                return productList;
            }
            
            async function initFirebaseData() {
                const productsRef = ref(db, 'products');
                const snap = await get(productsRef);
                if (!snap.exists()) {
                    const defaultProducts = generate30Products();
                    await set(productsRef, defaultProducts);
                    products = defaultProducts;
                    console.log("✅ 30 produits créés");
                } else {
                    const data = snap.val();
                    products = Array.isArray(data) ? data : Object.values(data || {});
                    if (products.length !== 30) {
                        const freshProducts = generate30Products();
                        await set(productsRef, freshProducts);
                        products = freshProducts;
                    }
                }
                
                onValue(productsRef, (snapshot) => {
                    const data = snapshot.val();
                    products = Array.isArray(data) ? data : Object.values(data || {});
                    renderApp();
                });
                
                const invRef = ref(db, `inventory/${currentUser.uid}`);
                onValue(invRef, (snap) => {
                    const data = snap.val();
                    userInventory = data ? Object.values(data) : [];
                    renderApp();
                });
            }
            
            async function registerOrLogin() {
                const username = document.getElementById('registerUsername').value.trim();
                const phone = document.getElementById('registerPhone').value.trim();
                if (!username || !phone) { showMessage("Remplissez tous les champs", "error"); return; }
                
                const usersRef = ref(db, 'users');
                const snap = await get(usersRef);
                const users = snap.val() || {};
                
                let found = null;
                for (const [uid, data] of Object.entries(users)) {
                    if (data.username === username && data.phone === phone) { found = uid; break; }
                }
                
                if (found) {
                    const userSnap = await get(ref(db, `users/${found}`));
                    currentUser = { uid: found, ...userSnap.val() };
                    showMessage(`✅ Bonjour ${currentUser.username}`, "success");
                } else {
                    const newUid = `user_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
                    await set(ref(db, `users/${newUid}`), { username, phone, balance: 2700, createdAt: new Date().toISOString() });
                    currentUser = { uid: newUid, username, phone, balance: 2700 };
                    showMessage(`✅ Bienvenue ${username} ! 2700 CFA offerts`, "success");
                }
                
                document.getElementById('registerModal').classList.remove('active');
                await initFirebaseData();
                startPriceVariation();
                renderApp();
            }
            
            function startPriceVariation() {
                setInterval(async () => {
                    if (!products?.length) return;
                    const updated = [...products];
                    let changed = false;
                    for (let i = 0; i < updated.length; i++) {
                        if (updated[i].isAvailable) {
                            let variation = 0.92 + Math.random() * 0.16;
                            let newRaw = Math.round(updated[i].currentPrice * variation);
                            newRaw = Math.round(newRaw / 50) * 50;
                            let closest = FIXED_PRICES.reduce((a, b) => Math.abs(b - newRaw) < Math.abs(a - newRaw) ? b : a);
                            if (closest !== updated[i].currentPrice) {
                                let lastVar = ((closest - updated[i].currentPrice) / updated[i].currentPrice) * 100;
                                updated[i] = { ...updated[i], currentPrice: closest, lastVariation: lastVar };
                                changed = true;
                            }
                        }
                    }
                    if (changed) await set(ref(db, 'products'), updated);
                }, 45000);
            }
            
            async function buyProduct(productId) {
                const idx = products.findIndex(p => p.id === productId);
                if (idx === -1 || !products[idx].isAvailable) { showMessage("Produit indisponible", "error"); return; }
                if (currentUser.balance < products[idx].currentPrice) { showMessage("Solde insuffisant", "error"); return; }
                
                const updated = [...products];
                updated[idx] = { ...products[idx], isAvailable: false, ownerId: currentUser.uid, ownerName: currentUser.username };
                await set(ref(db, 'products'), updated);
                
                const invItem = {
                    id: Date.now(),
                    productId: products[idx].id,
                    productName: products[idx].name,
                    productEmoji: products[idx].emoji,
                    productCategory: products[idx].category,
                    purchasePrice: products[idx].currentPrice,
                    purchaseDate: new Date().toISOString(),
                    resellAvailableAt: new Date(Date.now() + 30 * 60 * 1000).toISOString(),
                    isOnSale: false,
                    salePrice: null,
                    userId: currentUser.uid
                };
                await set(push(ref(db, `inventory/${currentUser.uid}`)), invItem);
                
                currentUser.balance -= products[idx].currentPrice;
                await update(ref(db, `users/${currentUser.uid}`), { balance: currentUser.balance });
                showMessage(`✅ Acheté: ${products[idx].name} (${products[idx].currentPrice.toLocaleString()} CFA)`, "success");
            }
            
            async function buyResale(invId) {
                const listing = userInventory.find(i => i.id === invId);
                if (!listing || !listing.isOnSale) { showMessage("Produit non disponible", "error"); return; }
                if (currentUser.balance < listing.salePrice) { showMessage("Solde insuffisant", "error"); return; }
                
                const sellerRef = ref(db, `users/${listing.userId}`);
                const sellerSnap = await get(sellerRef);
                if (sellerSnap.exists()) {
                    await update(sellerRef, { balance: (sellerSnap.val().balance || 0) + listing.salePrice });
                }
                
                currentUser.balance -= listing.salePrice;
                await update(ref(db, `users/${currentUser.uid}`), { balance: currentUser.balance });
                
                const prodIdx = products.findIndex(p => p.id === listing.productId);
                if (prodIdx !== -1) {
                    const updated = [...products];
                    updated[prodIdx] = { ...updated[prodIdx], isAvailable: true, ownerId: null, ownerName: null };
                    await set(ref(db, 'products'), updated);
                }
                
                await remove(ref(db, `inventory/${listing.userId}/${invId}`));
                showMessage(`🎉 Achat réussi ! Produit de retour sur le marché`, "success");
            }
            
            async function listForSale(invId, priceRaw) {
                const item = userInventory.find(i => i.id === invId);
                if (!item) return;
                const price = parseInt(priceRaw);
                if (isNaN(price) || price < 100) { showMessage("Prix invalide (min 100)", "error"); return; }
                if (new Date() < new Date(item.resellAvailableAt)) { showMessage("Attendez 30min", "error"); return; }
                await update(ref(db, `inventory/${currentUser.uid}/${invId}`), { isOnSale: true, salePrice: price });
                showMessage(`📢 ${item.productName} en vente à ${price.toLocaleString()} CFA`, "success");
            }
            
            async function cancelListing(invId) {
                await update(ref(db, `inventory/${currentUser.uid}/${invId}`), { isOnSale: false, salePrice: null });
                showMessage("Vente annulée", "info");
            }
            
            async function payAndStartQuiz() {
                if (!currentUser) return;
                if (currentUser.balance < 100) { showMessage("100 FCFA requis", "error"); return; }
                currentUser.balance -= 100;
                await update(ref(db, `users/${currentUser.uid}`), { balance: currentUser.balance });
                showMessage("100 FCFA débités. Bonne chance !", "success");
                startQuiz();
            }
            
            function startQuiz() {
                quizQuestions = generateQuizQuestions();
                quizAnswers = [];
                quizIndex = 0;
                quizActive = true;
                renderQuiz();
                document.getElementById('quizModal').classList.add('active');
            }
            
            function renderQuiz() {
                const container = document.getElementById('quizContainer');
                const resultDiv = document.getElementById('quizResult');
                resultDiv.style.display = 'none';
                
                if (quizIndex >= quizQuestions.length) {
                    const allCorrect = quizAnswers.length === 10 && quizAnswers.every((a, i) => a === quizQuestions[i].correctAnswer);
                    if (allCorrect) {
                        currentUser.balance += 100;
                        update(ref(db, `users/${currentUser.uid}`), { balance: currentUser.balance });
                        resultDiv.innerHTML = '<div style="color:#ffd700;">🏆 FÉLICITATIONS ! 100 FCFA remboursés</div>';
                        resultDiv.className = "quiz-result success";
                        showMessage("🎉 Bravo ! 100 FCFA remboursés", "success");
                    } else {
                        const correct = quizAnswers.filter((a, i) => a === quizQuestions[i].correctAnswer).length;
                        resultDiv.innerHTML = `<div>📊 ${correct}/10 bonnes réponses</div><div style="margin-top:8px;">Réessayez pour être remboursé !</div>`;
                        resultDiv.className = "quiz-result fail";
                    }
                    resultDiv.style.display = "block";
                    quizActive = false;
                    return;
                }
                
                const q = quizQuestions[quizIndex];
                const selected = quizAnswers[quizIndex] || null;
                
                // Affichage avec à la fois l'emoji et l'image pour garantir l'affichage
                container.innerHTML = `
                    <div class="quiz-progress">🎯 ${quizIndex+1}/10</div>
                    <div class="flag-container">
                        <div class="flag-emoji" style="font-size:3rem;">${q.emoji}</div>
                        <img class="flag-img" src="${q.flagUrl}" alt="Drapeau ${q.name}" onerror="this.style.display='none'">
                    </div>
                    <div style="margin:10px 0; font-weight:bold;">De quel pays est ce drapeau ?</div>
                    ${q.options.map(opt => `
                        <div class="quiz-option ${selected === opt ? 'selected' : ''}" onclick="window.selectQuizAnswer('${opt.replace(/'/g, "\\'")}')">
                            ${opt}
                        </div>
                    `).join('')}
                    <div style="margin-top:15px; display:flex; gap:8px; justify-content:center;">
                        ${quizIndex > 0 ? `<button class="confirm-btn" onclick="window.prevQuiz()" style="background:#e67e22; padding:6px 15px;">◀ Préc.</button>` : ''}
                        ${selected ? `<button class="confirm-btn" onclick="window.nextQuiz()" style="padding:6px 20px;">Suiv. ▶</button>` : '<button style="background:#7f8c8d; padding:6px 20px; border-radius:30px; border:none;" disabled>Répondez</button>'}
                    </div>
                `;
            }
            
            function selectQuizAnswer(answer) { if (quizActive) { quizAnswers[quizIndex] = answer; renderQuiz(); } }
            function nextQuiz() { if (quizActive && quizAnswers[quizIndex]) { quizIndex++; renderQuiz(); } }
            function prevQuiz() { if (quizActive && quizIndex > 0) { quizIndex--; renderQuiz(); } }
            function closeQuizModal() { document.getElementById('quizModal').classList.remove('active'); quizActive = false; }
            
            function renderApp() {
                const appDiv = document.getElementById('app');
                if (!products?.length || !currentUser) {
                    appDiv.innerHTML = '<div class="loading">✨ Chargement...</div>';
                    return;
                }
                
                let available = products.filter(p => p.isAvailable === true);
                if (searchTerm) available = available.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));
                if (selectedCategory && selectedCategory !== 'all') available = available.filter(p => p.category === selectedCategory);
                
                const totalPages = Math.ceil(available.length / itemsPerPage);
                const paginated = available.slice((currentPage-1)*itemsPerPage, currentPage*itemsPerPage);
                const allCats = [...new Set(products.map(p => p.category))];
                const myItems = userInventory.filter(i => !i.isOnSale);
                const mySales = userInventory.filter(i => i.isOnSale);
                
                let content = `
                    <div class="container">
                        <div class="header">
                            <div class="logo"><h1>📊 Trading Game Pro</h1><p>🎯 30 produits | 500→8000 CFA</p></div>
                            <div class="user-info">
                                <span class="username">👤 ${currentUser.username}</span>
                                <span class="balance">💰 ${currentUser.balance.toLocaleString()} CFA</span>
                                <button class="quiz-btn" onclick="window.payAndStartQuiz()">🏆 Quiz</button>
                                <button class="deposit-btn" onclick="window.openDepositModal()">💳 Dépôt</button>
                                <button class="withdraw-btn" onclick="window.openWithdrawModal()">💸 Retrait</button>
                                <button class="whatsapp-btn" onclick="window.openWhatsApp()">📱 Aide</button>
                            </div>
                        </div>
                        <div class="tabs">
                            <button class="tab-btn ${currentTab==='market' ? 'active' : ''}" onclick="window.switchTab('market')">🏪 Marché (${available.length})</button>
                            <button class="tab-btn ${currentTab==='inventory' ? 'active' : ''}" onclick="window.switchTab('inventory')">📦 Stock (${myItems.length})</button>
                            <button class="tab-btn ${currentTab==='resale' ? 'active' : ''}" onclick="window.switchTab('resale')">🔄 Vente (${mySales.length})</button>
                        </div>
                `;
                
                if (currentTab === 'market') {
                    content += `
                        <div class="search-bar">
                            <input placeholder="🔎 Rechercher..." id="searchInput" value="${searchTerm}" onkeyup="window.updateSearch(this.value)">
                            <select id="categorySelect" onchange="window.updateCategory(this.value)"><option value="all">Toutes</option>${allCats.map(c=>`<option value="${c}" ${selectedCategory===c ? 'selected' : ''}>${c}</option>`).join('')}</select>
                        </div>
                        <div class="products-grid">
                            ${paginated.map(p => `
                                <div class="product-card">
                                    <div class="product-emoji">${p.emoji}</div>
                                    <div class="product-name">${p.name}</div>
                                    <div class="product-category">${p.category}</div>
                                    <div class="product-price">${p.currentPrice.toLocaleString()} CFA</div>
                                    <div class="price-variation ${p.lastVariation >= 0 ? 'price-up' : 'price-down'}">${p.lastVariation >= 0 ? '📈 +' : '📉 '}${Math.abs(p.lastVariation || 0).toFixed(1)}%</div>
                                    <button class="buy-btn" onclick="window.buyProduct(${p.id})">🛒 Acheter</button>
                                </div>
                            `).join('')}
                        </div>
                        ${totalPages > 1 ? `<div class="pagination">${Array.from({length: Math.min(totalPages, 6)}, (_,i)=>i+1).map(p=>`<button class="page-btn ${p===currentPage ? 'active':''}" onclick="window.goToPage(${p})">${p}</button>`).join('')}</div>` : ''}
                    `;
                } else if (currentTab === 'inventory') {
                    content += myItems.length === 0 ? '<div class="loading">📭 Aucun produit en stock</div>' : 
                        myItems.map(i => `
                            <div class="inventory-item">
                                <div><h4>${i.productEmoji} ${i.productName}</h4><p>Achat: ${i.purchasePrice.toLocaleString()} CFA</p></div>
                                <div><input id="price_${i.id}" placeholder="Prix" class="set-price-input"><button class="sell-btn" onclick="window.listForSale(${i.id}, document.getElementById('price_${i.id}').value)">📢 Vendre</button></div>
                            </div>
                        `).join('');
                } else {
                    content += mySales.length === 0 ? '<div class="loading">📭 Aucune vente en cours</div>' :
                        mySales.map(i => `
                            <div class="listing-card">
                                <div><h4>${i.productEmoji} ${i.productName}</h4><p>💰 ${i.salePrice.toLocaleString()} CFA</p></div>
                                <div><button class="sell-btn" onclick="window.buyResale(${i.id})">🛒 Acheter</button><button class="sell-btn" style="background:#e74c3c;" onclick="window.cancelListing(${i.id})">❌</button></div>
                            </div>
                        `).join('');
                }
                
                content += `</div>`;
                appDiv.innerHTML = content;
            }
            
            function showMessage(msg, type) {
                const div = document.createElement('div');
                div.className = `message message-${type}`;
                div.innerText = msg;
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 3000);
            }
            
            async function submitDeposit() {
                const amount = parseInt(document.getElementById('depositAmount')?.value);
                const code = document.getElementById('depositCode')?.value;
                if (!amount || amount < 1000) { showMessage("Min 1000 CFA", "error"); return; }
                if (!code) { showMessage("Code requis", "error"); return; }
                await push(ref(db, 'deposits'), { userId: currentUser.uid, username: currentUser.username, phone: currentUser.phone, amount, transferCode: code, status: "pending", date: new Date().toISOString() });
                closeDepositModal();
                showMessage(`Dépôt ${amount.toLocaleString()} CFA demandé`, "success");
            }
            
            async function submitWithdraw() {
                const amount = parseInt(document.getElementById('withdrawAmount')?.value);
                if (!amount || amount < 3000 || amount > 50000 || amount > currentUser.balance) { showMessage("Montant invalide", "error"); return; }
                await push(ref(db, 'withdraws'), { userId: currentUser.uid, username: currentUser.username, phone: currentUser.phone, amount, status: "pending", date: new Date().toISOString() });
                closeWithdrawModal();
                showMessage(`Retrait ${amount.toLocaleString()} CFA demandé`, "success");
            }
            
            function openWhatsApp() { window.open("https://wa.me/22797413067", "_blank"); }
            function openDepositModal() { document.getElementById('depositModal').classList.add('active'); }
            function closeDepositModal() { document.getElementById('depositModal').classList.remove('active'); }
            function openWithdrawModal() { document.getElementById('withdrawModal').classList.add('active'); }
            function closeWithdrawModal() { document.getElementById('withdrawModal').classList.remove('active'); }
            function switchTab(tab) { currentTab = tab; currentPage = 1; renderApp(); }
            function updateSearch(v) { searchTerm = v; currentPage = 1; renderApp(); }
            function updateCategory(v) { selectedCategory = v; currentPage = 1; renderApp(); }
            function goToPage(p) { currentPage = p; renderApp(); }
            
            window.registerOrLogin = registerOrLogin;
            window.buyProduct = buyProduct;
            window.buyResale = buyResale;
            window.listForSale = listForSale;
            window.cancelListing = cancelListing;
            window.payAndStartQuiz = payAndStartQuiz;
            window.selectQuizAnswer = selectQuizAnswer;
            window.nextQuiz = nextQuiz;
            window.prevQuiz = prevQuiz;
            window.closeQuizModal = closeQuizModal;
            window.switchTab = switchTab;
            window.updateSearch = updateSearch;
            window.updateCategory = updateCategory;
            window.goToPage = goToPage;
            window.openDepositModal = openDepositModal;
            window.closeDepositModal = closeDepositModal;
            window.openWithdrawModal = openWithdrawModal;
            window.closeWithdrawModal = closeWithdrawModal;
            window.submitDeposit = submitDeposit;
            window.submitWithdraw = submitWithdraw;
            window.openWhatsApp = openWhatsApp;
            
            document.getElementById('registerModal').classList.add('active');
        }
    </script>
</body>
</html>
