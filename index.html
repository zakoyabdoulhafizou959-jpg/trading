<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>StarGame - 100 Produits | Achat & Quotidien 45%</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1a2e, #0a0f24, #0a1927);
            min-height: 100vh;
            color: #f0f3fa;
            padding-bottom: 30px;
        }

        .container { max-width: 100%; padding: 12px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            padding: 10px 15px;
            border-radius: 28px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid rgba(255, 200, 50, 0.5);
        }

        .logo h1 { font-size: 1.2em; background: linear-gradient(135deg, #FFD966, #FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { font-size: 0.6em; opacity: 0.8; }

        .user-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .balance, .username {
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75em;
            background: rgba(0,0,0,0.5);
        }
        .balance { background: linear-gradient(135deg, #2ecc71, #1e8e4a); }
        .username { background: #2c3e8f; }

        .deposit-btn, .withdraw-btn, .logout-btn, .support-btn {
            border: none;
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.7em;
            cursor: pointer;
        }
        .deposit-btn { background: #1abc9c; color: white; }
        .withdraw-btn { background: #e67e22; color: white; }
        .logout-btn { background: #c0392b; color: white; }
        .support-btn { background: #25D366; color: white; }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8em;
        }
        .tab-btn.active { background: #f39c12; color: #0a0f24; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        .product-card {
            background: rgba(25, 35, 55, 0.8);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            padding: 10px 6px;
            text-align: center;
            border: 1px solid rgba(255,200,80,0.3);
        }
        .product-emoji { font-size: 32px; margin-bottom: 4px; }
        .product-name { font-size: 0.8em; font-weight: bold; }
        .product-category { font-size: 0.6em; opacity: 0.7; background: rgba(0,0,0,0.4); display: inline-block; padding: 2px 8px; border-radius: 30px; margin: 4px 0; }
        .product-price { font-size: 0.9em; font-weight: bold; color: #FFD966; margin: 5px 0; }
        .buy-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border: none;
            padding: 6px 10px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            width: 95%;
            font-size: 0.7em;
        }

        .inventory-item {
            background: rgba(25, 40, 55, 0.85);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 5px solid #f39c12;
        }
        .timer-active {
            background: rgba(46,204,113,0.25);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 0.65em;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }
        .play-game-btn {
            background: #e67e22;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75em;
        }
        .product-detail { font-size: 0.75em; margin: 3px 0; color: #ccc; }
        
        .search-bar { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-bar input { flex: 1; padding: 8px 12px; border-radius: 50px; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 0.8em; }
        .search-bar select { padding: 8px 12px; border-radius: 50px; border: none; background: rgba(255,255,255,0.15); color: white; font-size: 0.75em; }

        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 15px; flex-wrap: wrap; }
        .page-btn { background: rgba(255,255,255,0.2); border: none; padding: 4px 10px; border-radius: 30px; cursor: pointer; color: white; font-size: 0.7em; }
        .page-btn.active { background: #f39c12; color: #0a0f24; }

        .message {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            z-index: 2000;
            font-weight: bold;
        }
        .message-success { background: #27ae60; color: white; }
        .message-error { background: #e74c3c; color: white; }
        .message-info { background: #2980b9; color: white; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: linear-gradient(145deg, #1e2a3a, #0f1722);
            padding: 25px;
            border-radius: 36px;
            max-width: 90%;
            width: 380px;
            text-align: center;
            border: 1px solid #f39c12;
        }
        .modal-content h2 { color: #ffd966; margin-bottom: 18px; font-size: 1.3em; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
        }
        .modal-content select option { background: #1e2a3a; color: white; }
        .confirm-btn, .close-modal { padding: 8px 20px; border-radius: 50px; margin: 5px; font-weight: bold; cursor: pointer; border: none; }
        .confirm-btn { background: #2ecc71; color: white; }
        .close-modal { background: #e74c3c; color: white; }

        .flag-container { display: flex; justify-content: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
        .flag-img { width: 90px; height: 60px; object-fit: cover; border-radius: 12px; border: 2px solid gold; }
        .quiz-option {
            background: rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 10px;
            margin: 8px 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-option:hover { background: rgba(255,255,255,0.2); }
        .quiz-option.selected { background: #f39c12; color: #1e2a3a; font-weight: bold; }
        .game-stats { font-size: 0.75rem; margin-bottom: 8px; color: #ffd966; }
        .loading { text-align: center; padding: 40px; font-size: 0.9em; opacity: 0.8; }
        .phone-hint { font-size: 0.65em; color: #ffaa66; margin-top: -5px; margin-bottom: 8px; text-align: left; }

        @media (min-width: 640px) {
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
        }
    </style>
</head>

<script>
    // SONS & VIBRATION
    function playSound(type) {
        try {
            let audio = new Audio();
            if (type === 'win') audio = new Audio("https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3");
            else if (type === 'lose') audio = new Audio("https://www.soundjay.com/misc/sounds/failure-drum.mp3");
            else if (type === 'click') audio = new Audio("https://www.soundjay.com/misc/sounds/button-click.mp3");
            else if (type === 'deposit') audio = new Audio("https://www.soundjay.com/misc/sounds/cash-register.mp3");
            audio.volume = 0.4;
            audio.play().catch(e => console.log("Audio bloqué"));
        } catch(e) {}
    }
    function vibrate(pattern) { if(window.navigator?.vibrate) window.navigator.vibrate(pattern); }
    
    // 45+ PAYS POUR LE QUIZ (difficile)
    const ALL_COUNTRIES = [
        { name: "Niger", emoji: "🇳🇪", code: "ne" }, { name: "France", emoji: "🇫🇷", code: "fr" },
        { name: "Sénégal", emoji: "🇸🇳", code: "sn" }, { name: "Côte d'Ivoire", emoji: "🇨🇮", code: "ci" },
        { name: "Cameroun", emoji: "🇨🇲", code: "cm" }, { name: "Maroc", emoji: "🇲🇦", code: "ma" },
        { name: "Algérie", emoji: "🇩🇿", code: "dz" }, { name: "Tunisie", emoji: "🇹🇳", code: "tn" },
        { name: "RDC", emoji: "🇨🇩", code: "cd" }, { name: "Nigéria", emoji: "🇳🇬", code: "ng" },
        { name: "Égypte", emoji: "🇪🇬", code: "eg" }, { name: "Mali", emoji: "🇲🇱", code: "ml" },
        { name: "Burkina Faso", emoji: "🇧🇫", code: "bf" }, { name: "Bénin", emoji: "🇧🇯", code: "bj" },
        { name: "Togo", emoji: "🇹🇬", code: "tg" }, { name: "Ghana", emoji: "🇬🇭", code: "gh" },
        { name: "Guinée", emoji: "🇬🇳", code: "gn" }, { name: "Gabon", emoji: "🇬🇦", code: "ga" },
        { name: "Rwanda", emoji: "🇷🇼", code: "rw" }, { name: "Madagascar", emoji: "🇲🇬", code: "mg" },
        { name: "Canada", emoji: "🇨🇦", code: "ca" }, { name: "Belgique", emoji: "🇧🇪", code: "be" },
        { name: "Suisse", emoji: "🇨🇭", code: "ch" }, { name: "Allemagne", emoji: "🇩🇪", code: "de" },
        { name: "Espagne", emoji: "🇪🇸", code: "es" }, { name: "Italie", emoji: "🇮🇹", code: "it" },
        { name: "Royaume-Uni", emoji: "🇬🇧", code: "gb" }, { name: "Brésil", emoji: "🇧🇷", code: "br" },
        { name: "Japon", emoji: "🇯🇵", code: "jp" }, { name: "Inde", emoji: "🇮🇳", code: "in" },
        { name: "Chine", emoji: "🇨🇳", code: "cn" }, { name: "Russie", emoji: "🇷🇺", code: "ru" },
        { name: "Mexique", emoji: "🇲🇽", code: "mx" }, { name: "Argentine", emoji: "🇦🇷", code: "ar" },
        { name: "Afrique du Sud", emoji: "🇿🇦", code: "za" }, { name: "Kenya", emoji: "🇰🇪", code: "ke" },
        { name: "Angola", emoji: "🇦🇴", code: "ao" }, { name: "Zambie", emoji: "🇿🇲", code: "zm" },
        { name: "Ouganda", emoji: "🇺🇬", code: "ug" }, { name: "Tanzanie", emoji: "🇹🇿", code: "tz" },
        { name: "Mozambique", emoji: "🇲🇿", code: "mz" }, { name: "Chili", emoji: "🇨🇱", code: "cl" },
        { name: "Pérou", emoji: "🇵🇪", code: "pe" }, { name: "Colombie", emoji: "🇨🇴", code: "co" },
        { name: "Venezuela", emoji: "🇻🇪", code: "ve" }, { name: "Suède", emoji: "🇸🇪", code: "se" },
        { name: "Norvège", emoji: "🇳🇴", code: "no" }, { name: "Pays-Bas", emoji: "🇳🇱", code: "nl" }
    ];
    
    function getFlagUrl(code) { return `https://flagcdn.com/w120/${code}.png`; }
    
    function generateGameQuestions() {
        const shuffled = [...ALL_COUNTRIES].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 10);
        return selected.map(item => {
            const wrongs = ALL_COUNTRIES.filter(c => c.name !== item.name).sort(() => 0.5 - Math.random()).slice(0, 3);
            const options = [item.name, ...wrongs.map(w => w.name)];
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            return { name: item.name, emoji: item.emoji, flagUrl: getFlagUrl(item.code), correctAnswer: item.name, options };
        });
    }
    
    // GÉNÉRATION DE 100 PRODUITS
    function generateProductList() {
        const categories = ["Or", "Diamant", "Montre", "Smartphone", "PC", "Console", "Casque", "Crypto", "Immobilier", "Bourse", "Voiture", "Moto", "Avion", "Yacht", "Art", "NFT", "Montre Luxe", "Sac", "Chaussures", "Parfum"];
        const emojis = {
            "Or":"🪙","Diamant":"💎","Montre":"⌚","Smartphone":"📱","PC":"💻","Console":"🎮","Casque":"🎧","Crypto":"₿","Immobilier":"🏠","Bourse":"📈",
            "Voiture":"🚗","Moto":"🏍️","Avion":"✈️","Yacht":"⛵","Art":"🎨","NFT":"🖼️","Montre Luxe":"⌚","Sac":"👜","Chaussures":"👟","Parfum":"🧴"
        };
        let list = [];
        const pricesList = [500, 800, 1000, 1200, 1500, 1800, 2000, 2500, 3000, 3500, 4000, 4500, 5000];
        for (let i = 0; i < 100; i++) {
            let cat = categories[i % categories.length];
            let productNum = Math.floor(i / categories.length) + 1;
            let price = pricesList[i % pricesList.length];
            list.push({
                id: i + 1,
                name: `${cat} ${productNum}`,
                category: cat,
                emoji: emojis[cat] || "📦",
                currentPrice: price,
                isAvailable: true,
                ownerId: null
            });
        }
        return list;
    }
    
    // FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyCxsXpj3ovdd2Wu5HNHN1Zyvf7qG00aXx4",
        authDomain: "dubai-dbd3f.firebaseapp.com",
        databaseURL: "https://dubai-dbd3f-default-rtdb.firebaseio.com",
        projectId: "dubai-dbd3f",
        storageBucket: "dubai-dbd3f.firebasestorage.app",
        messagingSenderId: "543622740538",
        appId: "1:543622740538:web:0e4e6abf3124a878dad303"
    };

    let db, ref, set, get, push, onValue, update;
    let currentUser = null;
    let products = [];
    let userInventory = [];
    let currentTab = 'market';
    let searchTerm = '';
    let selectedCategory = '';
    let currentPage = 1;
    const itemsPerPage = 24;
    const MAX_PRODUCT_PRICE = 5000;
    const SUPPORT_PHONE = "97413067";
    
    let activeGameItem = null;
    let gameQuestions = [], gameAnswers = [], gameIndex = 0, gameActive = false;
    let onGameComplete = null;
    
    async function initFirebase() {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js");
        const { getDatabase, ref: dbRef, set: dbSet, get: dbGet, push: dbPush, onValue: dbOnValue, update: dbUpdate } = await import("https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js");
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        db = database; ref = dbRef; set = dbSet; get = dbGet; push = dbPush; onValue = dbOnValue; update = dbUpdate;
        return { db, ref, set, get, push, onValue, update };
    }
    
    async function processDailyEarnings() {
        if (!currentUser) return;
        const now = new Date();
        let updated = false;
        for (let inv of userInventory) {
            if (!inv.dailyClaimed) inv.dailyClaimed = [];
            if (inv.gainDaysLeft === undefined) inv.gainDaysLeft = 3;
            if (inv.gainDaysLeft <= 0) continue;
            const purchaseDate = new Date(inv.purchaseDate);
            const dayIndex = Math.floor((now - purchaseDate) / (1000*60*60*24));
            if (dayIndex >= 1 && dayIndex <= 3 && !inv.dailyClaimed.includes(dayIndex)) {
                const reward = Math.floor(inv.purchasePrice * 0.45);
                currentUser.balance += reward;
                inv.dailyClaimed.push(dayIndex);
                inv.gainDaysLeft--;
                updated = true;
                playSound('deposit');
                vibrate([100, 50, 100]);
                showMessage(`✨ ${inv.productName} : +${reward.toLocaleString()} CFA (gain jour ${dayIndex})`, "success");
                await update(ref(db, `inventory/${currentUser.uid}/${inv.id}`), { dailyClaimed: inv.dailyClaimed, gainDaysLeft: inv.gainDaysLeft });
                await update(ref(db, `users/${currentUser.uid}`), { balance: currentUser.balance });
            }
        }
        if (updated) renderApp();
    }
    
    async function buyProduct(productId) {
        playSound('click');
        vibrate(50);
        if (!currentUser) return;
        const productsRef = ref(db, 'products');
        let snap = await get(productsRef);
        let allProducts = [];
        const snapVal = snap.val();
        if (snapVal) allProducts = Array.isArray(snapVal) ? snapVal : Object.values(snapVal);
        const product = allProducts.find(p => p.id === productId);
        if (!product || !product.isAvailable) { showMessage("Produit indisponible", "error"); return; }
        if (currentUser.balance < product.currentPrice) { showMessage("Solde insuffisant", "error"); return; }
        if (product.currentPrice > MAX_PRODUCT_PRICE) { showMessage(`Prix max ${MAX_PRODUCT_PRICE} CFA`, "error"); return; }
        
        currentUser.balance -= product.currentPrice;
        await update(ref(db, `users/${currentUser.uid}`), { balance: currentUser.balance });
        
        const updatedProducts = allProducts.map(p => p.id === productId ? { ...p, isAvailable: false, ownerId: currentUser.uid } : p);
        await set(productsRef, updatedProducts);
        
        const newItem = {
            id: Date.now(),
            productId: product.id,
            productName: product.name,
            productEmoji: product.emoji,
            productCategory: product.category,
            purchasePrice: product.currentPrice,
            purchaseDate: new Date().toISOString(),
            gainDaysLeft: 3,
            dailyClaimed: [],
        };
        await push(ref(db, `inventory/${currentUser.uid}`), newItem);
        playSound('deposit');
        showMessage(`✅ Achat réussi ! ${product.name} retiré du marché.`, "success");
        await refreshUserInventory();
        renderApp();
    }
    
    async function playGameForItem(itemId) {
        playSound('click');
        const item = userInventory.find(i => i.id === itemId);
        if (!item) { showMessage("Produit non trouvé", "error"); return; }
        if (item.gainDaysLeft <= 0) { showMessage("Plus de jours de gain", "error"); return; }
        if (currentUser.balance < 500) { showMessage("500 CFA requis", "error"); return; }
        
        currentUser.balance -= 500;
        await update(ref(db, `users/${currentUser.uid}`), { balance: currentUser.balance });
        
        activeGameItem = item;
        gameQuestions = generateGameQuestions();
        gameAnswers = [];
        gameIndex = 0;
        gameActive = true;
        
        onGameComplete = async (isWin) => {
            const reward = isWin ? Math.floor(item.purchasePrice * 0.45) : Math.floor(item.purchasePrice * 0.10);
            currentUser.balance += reward;
            if (isWin) { playSound('win'); vibrate([200, 100, 200]); }
            else { playSound('lose'); vibrate([300]); }
            
            const now = new Date();
            const purchaseDate = new Date(item.purchaseDate);
            const dayIndex = Math.floor((now - purchaseDate) / (1000*60*60*24));
            if (!item.dailyClaimed) item.dailyClaimed = [];
            if (dayIndex >= 1 && dayIndex <= 3 && !item.dailyClaimed.includes(dayIndex)) {
                item.dailyClaimed.push(dayIndex);
                item.gainDaysLeft--;
                await update(ref(db, `inventory/${currentUser.uid}/${item.id}`), { dailyClaimed: item.dailyClaimed, gainDaysLeft: item.gainDaysLeft });
            }
            await update(ref(db, `users/${currentUser.uid}`), { balance: currentUser.balance });
            showMessage(isWin ? `🏆 VICTOIRE ! +${reward.toLocaleString()} CFA` : `😞 Perdu... +${reward.toLocaleString()} CFA`, isWin ? "success" : "info");
            renderApp();
        };
        renderGameModal();
        document.getElementById('gameModal').classList.add('active');
    }
    
    function renderGameModal() {
        const container = document.getElementById('GameQuizContainer');
        const resultDiv = document.getElementById('gameResultArea');
        resultDiv.style.display = 'none';
        if (!gameActive || gameIndex >= gameQuestions.length) {
            const allCorrect = gameAnswers.length === 10 && gameAnswers.every((a, i) => a === gameQuestions[i].correctAnswer);
            if (onGameComplete) onGameComplete(allCorrect);
            resultDiv.innerHTML = allCorrect ? '<div style="color:#2ecc71; margin:10px;">🏆 VICTOIRE ! 45% ajouté</div>' : '<div style="color:#e67e22; margin:10px;">🔻 Défaite... 10% ajouté</div>';
            resultDiv.style.display = "block";
            gameActive = false;
            setTimeout(() => { document.getElementById('gameModal').classList.remove('active'); onGameComplete = null; }, 2000);
            return;
        }
        const q = gameQuestions[gameIndex];
        const selected = gameAnswers[gameIndex] || null;
        container.innerHTML = `
            <div class="game-stats">🎯 Question ${gameIndex+1}/10</div>
            <div class="flag-container"><img class="flag-img" src="${q.flagUrl}" onerror="this.style.display='none'"><span style="font-size:2rem;">${q.emoji}</span></div>
            <div style="margin:8px 0; font-weight:bold;">De quel pays est ce drapeau ?</div>
            ${q.options.map(opt => `<div class="quiz-option ${selected === opt ? 'selected' : ''}" onclick="window.selectGameAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</div>`).join('')}
            <div style="margin:15px 0 5px;">${gameIndex>0?`<button class="confirm-btn" onclick="window.prevGame()" style="background:#e67e22;">◀ Préc</button>`:''}<button class="confirm-btn" onclick="window.nextGame()" style="margin-left:8px;">Suivant ▶</button></div>
        `;
    }
    
    function selectGameAnswer(ans) { if(gameActive) { gameAnswers[gameIndex] = ans; renderGameModal(); } }
    function nextGame() { if(gameActive && gameAnswers[gameIndex] && gameIndex+1 <= gameQuestions.length) { gameIndex++; renderGameModal(); } }
    function prevGame() { if(gameActive && gameIndex>0) { gameIndex--; renderGameModal(); } }
    function closeGameModal() { document.getElementById('gameModal').classList.remove('active'); gameActive = false; onGameComplete = null; renderApp(); }
    
    async function refreshUserInventory() {
        const snap = await get(ref(db, `inventory/${currentUser.uid}`));
        userInventory = snap.exists() ? Object.values(snap.val()) : [];
    }
    
    async function submitDeposit() {
        playSound('click');
        if (!currentUser) return;
        const amount = parseInt(document.getElementById('depositAmount').value);
        const code = document.getElementById('depositCode').value.trim();
        if (!amount || amount < 1000) { showMessage("Min 1000 CFA", "error"); return; }
        if (!code) { showMessage("Code requis", "error"); return; }
        await push(ref(db, 'deposits'), { userId: currentUser.uid, username: currentUser.username, phone: currentUser.phone, amount, transferCode: code, status: 'pending', date: new Date().toISOString() });
        playSound('deposit');
        showMessage(`✅ Demande de dépôt envoyée !`, "success");
        window.closeDepositModal();
        document.getElementById('depositAmount').value = ''; document.getElementById('depositCode').value = '';
    }
    
    async function submitWithdraw() {
        playSound('click');
        if (!currentUser) return;
        const amount = parseInt(document.getElementById('withdrawAmount').value);
        if (!amount || amount < 3000) { showMessage("Min 3000 CFA", "error"); return; }
        if (amount > 50000) { showMessage("Max 50000 CFA", "error"); return; }
        if (amount > currentUser.balance) { showMessage("Solde insuffisant", "error"); return; }
        await push(ref(db, 'withdraws'), { userId: currentUser.uid, username: currentUser.username, phone: currentUser.phone, amount, status: 'pending', date: new Date().toISOString() });
        showMessage(`✅ Demande de retrait envoyée !`, "success");
        window.closeWithdrawModal();
        document.getElementById('withdrawAmount').value = '';
    }
    
    function contactSupport() { playSound('click'); window.location.href = `tel:${SUPPORT_PHONE}`; }
    
    async function startApp() {
        await initFirebase();
        const productsRef = ref(db, 'products');
        let snap = await get(productsRef);
        if (!snap.exists()) await set(productsRef, generateProductList());
        onValue(productsRef, (snapshot) => {
            const data = snapshot.val();
            const all = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
            products = all.filter(p => p.isAvailable === true);
            renderApp();
        });
        const invRef = ref(db, `inventory/${currentUser.uid}`);
        onValue(invRef, async (snapInv) => {
            userInventory = snapInv.exists() ? Object.values(snapInv.val()) : [];
            await processDailyEarnings();
            renderApp();
        });
        setInterval(async () => { await processDailyEarnings(); }, 60000);
        renderApp();
    }
    
    function renderApp() {
        if (!currentUser) return;
        let available = products.filter(p => p.isAvailable === true && p.currentPrice <= MAX_PRODUCT_PRICE);
        if (searchTerm) available = available.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));
        if (selectedCategory && selectedCategory !== 'all') available = available.filter(p => p.category === selectedCategory);
        const totalPages = Math.ceil(available.length / itemsPerPage);
        const paginated = available.slice((currentPage-1)*itemsPerPage, currentPage*itemsPerPage);
        const allCats = [...new Set(products.map(p=>p.category))];
        let content = `<div class="container"><div class="header"><div class="logo"><h1>🎲 STAR GAME 45%</h1><p>📦 100 produits | Achat → Jeu quotidien</p></div><div class="user-info"><span class="username">👤 ${currentUser.username}</span><span class="balance">💰 ${currentUser.balance.toLocaleString()} CFA</span><button class="support-btn" onclick="window.contactSupport()">📞 ${SUPPORT_PHONE}</button><button class="deposit-btn" onclick="window.openDepositModal()">➕ Dépôt</button><button class="withdraw-btn" onclick="window.openWithdrawModal()">💸 Retrait</button><button class="logout-btn" onclick="window.logout()">🚪 Exit</button></div></div>
        <div class="tabs"><button class="tab-btn ${currentTab==='market'?'active':''}" onclick="window.switchTab('market')">🛍️ Marché (${available.length})</button><button class="tab-btn ${currentTab==='inventory'?'active':''}" onclick="window.switchTab('inventory')">📦 Mes produits (${userInventory.length})</button></div>`;
        if (currentTab === 'market') {
            content += `<div class="search-bar"><input id="searchInput" placeholder="🔍 Rechercher" value="${searchTerm}" onkeyup="window.updateSearch(this.value)"><select id="catSelect" onchange="window.updateCategory(this.value)"><option value="all">Toutes catégories</option>${allCats.map(c=>`<option value="${c}" ${selectedCategory===c?'selected':''}>${c}</option>`).join('')}</select></div>
            <div class="products-grid">${paginated.map(p => `<div class="product-card"><div class="product-emoji">${p.emoji}</div><div class="product-name">${p.name}</div><div class="product-category">${p.category}</div><div class="product-price">${p.currentPrice.toLocaleString()} CFA</div><button class="buy-btn" onclick="window.buyProduct(${p.id})">✔️ Acheter</button></div>`).join('')}</div>
            ${totalPages>1?`<div class="pagination">${Array.from({length:Math.min(totalPages,6)},(_,i)=>i+1).map(p=>`<button class="page-btn ${p===currentPage?'active':''}" onclick="window.goToPage(${p})">${p}</button>`).join('')}</div>`:''}`;
        } else {
            if (userInventory.length === 0) content += `<div class="loading">🌟 Aucun produit acheté.</div>`;
            else userInventory.forEach(item => {
                const daysLeft = item.gainDaysLeft || 0;
                const claimedCount = (item.dailyClaimed || []).length;
                content += `<div class="inventory-item"><div><strong>${item.productEmoji} ${item.productName}</strong><div class="product-detail">💰 ${item.purchasePrice.toLocaleString()} CFA</div><div class="timer-active">⏳ Gains restants: ${daysLeft} jour(s) (${claimedCount}/3)</div></div><div>${daysLeft > 0 ? `<button class="play-game-btn" onclick="window.playGameForItem(${item.id})">🎮 Jouer (500 CFA)<br><span style="font-size:0.6rem;">45% ou 10%</span></button>` : `<span style="background:#2c3e50; padding:8px 15px; border-radius:30px;">✅ Terminé</span>`}</div></div>`;
            });
        }
        content += `</div>`; document.getElementById('app').innerHTML = content;
    }
    
    function validatePhone(phone) { return /^\d{8}$/.test(phone); }
    function validatePassword(pwd) { return /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8}$/.test(pwd); }
    
    async function handleAuth() {
        let u = document.getElementById('authUsername').value.trim();
        let phone = document.getElementById('authPhone').value.trim();
        let country = document.getElementById('authCountry').value;
        let pwd = document.getElementById('authPassword').value;
        if (!u || u.length < 3) { showMessage("Nom (min 3)", "error"); return; }
        if (!validatePhone(phone)) { showMessage("Numéro 8 chiffres", "error"); return; }
        if (!country) { showMessage("Choisissez pays", "error"); return; }
        if (!validatePassword(pwd)) { showMessage("MDP: 8 caractères lettres+chiffres", "error"); return; }
        await initFirebase();
        const usersRef = ref(db, 'users');
        const snap = await get(usersRef);
        const users = snap.val() || {};
        if (!isLoginMode) {
            let exists = Object.values(users).some(usr => usr.username === u || usr.phone === phone);
            if (exists) { showMessage("Pseudo ou numéro déjà utilisé", "error"); return; }
            const uid = `user_${Date.now()}_${Math.random().toString(36).substr(2,6)}`;
            await set(ref(db, `users/${uid}`), { username: u, phone: phone, country: country, password: pwd, balance: 5000 });
            currentUser = { uid, username: u, phone: phone, country: country, balance: 5000 };
            showMessage(`✅ Inscription réussie ! 5000 CFA`, "success");
        } else {
            let found = null;
            for (let [id, val] of Object.entries(users)) {
                if ((val.username === u || val.phone === phone) && val.password === pwd) { found = { uid: id, ...val }; break; }
            }
            if (!found) { showMessage("Identifiants incorrects", "error"); return; }
            currentUser = found;
        }
        localStorage.setItem('tradingUser', JSON.stringify({ uid: currentUser.uid, username: currentUser.username }));
        document.getElementById('authModal').classList.remove('active');
        await startApp();
    }
    
    function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('authTitle').innerText = isLoginMode ? "🔐 CONNEXION" : "📝 INSCRIPTION"; document.getElementById('authBtn').innerText = isLoginMode ? "Se connecter" : "S'inscrire"; }
    async function logout() { localStorage.removeItem('tradingUser'); currentUser = null; document.getElementById('authModal').classList.add('active'); document.getElementById('app').innerHTML = ''; }
    function showMessage(msg, type) { let div = document.createElement('div'); div.className = `message message-${type}`; div.innerText = msg; document.body.appendChild(div); setTimeout(() => div.remove(), 3000); }
    
    window.handleAuth = handleAuth; window.toggleAuthMode = toggleAuthMode; window.buyProduct = buyProduct; window.playGameForItem = playGameForItem;
    window.selectGameAnswer = selectGameAnswer; window.nextGame = nextGame; window.prevGame = prevGame; window.closeGameModal = closeGameModal;
    window.switchTab = (t) => { currentTab = t; currentPage = 1; renderApp(); }; window.updateSearch = (v) => { searchTerm = v; currentPage = 1; renderApp(); };
    window.updateCategory = (c) => { selectedCategory = c; currentPage = 1; renderApp(); }; window.goToPage = (p) => { currentPage = p; renderApp(); };
    window.openDepositModal = () => document.getElementById('depositModal').classList.add('active'); window.closeDepositModal = () => document.getElementById('depositModal').classList.remove('active');
    window.openWithdrawModal = () => document.getElementById('withdrawModal').classList.add('active'); window.closeWithdrawModal = () => document.getElementById('withdrawModal').classList.remove('active');
    window.submitDeposit = submitDeposit; window.submitWithdraw = submitWithdraw; window.contactSupport = contactSupport; window.logout = logout;
    
    let isLoginMode = true;
    (async () => {
        let saved = localStorage.getItem('tradingUser');
        if (saved) {
            try {
                let { uid } = JSON.parse(saved);
                await initFirebase();
                let userSnap = await get(ref(db, `users/${uid}`));
                if (userSnap.exists()) { currentUser = { uid, ...userSnap.val() }; document.getElementById('authModal').classList.remove('active'); await startApp(); return; }
            } catch(e) {}
        }
        document.getElementById('authModal').classList.add('active');
    })();
</script>
</body>
