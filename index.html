<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StarGame - 100 Produits | Gagnez 140%</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1a2e, #0a0f24);
            min-height: 100vh;
            color: #f0f3fa;
            padding-bottom: 30px;
        }
        .container { max-width: 100%; padding: 12px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            padding: 10px 15px;
            border-radius: 28px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid rgba(255,200,50,0.5);
        }
        .logo h1 { font-size: 1.2em; background: linear-gradient(135deg, #FFD966, #FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { font-size: 0.6em; opacity: 0.8; color: #ffaa44; }
        .user-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .balance, .username {
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75em;
            background: rgba(0,0,0,0.5);
        }
        .balance { background: linear-gradient(135deg, #2ecc71, #1e8e4a); }
        .username { background: #2c3e8f; }
        .deposit-btn, .withdraw-btn, .logout-btn, .support-btn {
            border: none;
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.7em;
            cursor: pointer;
        }
        .deposit-btn { background: #1abc9c; color: white; }
        .withdraw-btn { background: #e67e22; color: white; }
        .logout-btn { background: #c0392b; color: white; }
        .support-btn { background: #25D366; color: white; }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        .tab-btn.active { background: #f39c12; color: #0a0f24; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .product-card {
            background: rgba(25,35,55,0.8);
            border-radius: 20px;
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(255,200,80,0.3);
        }
        .product-emoji { font-size: 32px; }
        .product-name { font-size: 0.7em; font-weight: bold; }
        .product-price { font-size: 0.8em; font-weight: bold; color: #FFD966; }
        .buy-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border: none;
            padding: 6px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 5px;
        }
        .inventory-item {
            background: rgba(25,40,55,0.85);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 5px solid #f39c12;
        }
        .play-game-btn {
            background: #e67e22;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .search-bar { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-bar input { flex: 1; padding: 8px 12px; border-radius: 50px; background: rgba(255,255,255,0.1); color: white; border: none; }
        .message {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            z-index: 2000;
            font-weight: bold;
        }
        .message-success { background: #27ae60; }
        .message-error { background: #e74c3c; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: linear-gradient(145deg, #1e2a3a, #0f1722);
            padding: 25px;
            border-radius: 36px;
            max-width: 90%;
            width: 380px;
            text-align: center;
        }
        .confirm-btn, .close-modal { padding: 8px 20px; border-radius: 50px; margin: 5px; font-weight: bold; cursor: pointer; border: none; }
        .confirm-btn { background: #2ecc71; color: white; }
        .close-modal { background: #e74c3c; color: white; }
        .pending-badge { background: #f39c12; color: #1e2a3a; padding: 4px 12px; border-radius: 20px; font-size: 0.7em; display: inline-block; }
    </style>
</head>
<body>
<div id="app"></div>

<!-- MODALE AUTH -->
<div id="authModal" class="modal active">
    <div class="modal-content">
        <h2>🔐 STAR GAME 140%</h2>
        <div id="loginForm">
            <input type="tel" id="loginPhone" placeholder="📞 Numéro (8 chiffres)">
            <input type="password" id="loginPassword" placeholder="🔒 Mot de passe">
            <button class="confirm-btn" onclick="window.login()">Se connecter</button>
        </div>
        <div id="signupForm" style="display:none;">
            <input type="text" id="signupName" placeholder="👤 Nom d'utilisateur">
            <input type="tel" id="signupPhone" placeholder="📞 Numéro (8 chiffres)">
            <input type="password" id="signupPassword" placeholder="🔒 Mot de passe (8 caractères)">
            <button class="confirm-btn" onclick="window.signup()">S'inscrire</button>
        </div>
        <div class="switch-auth" style="margin-top:12px;color:#f39c12;cursor:pointer;" onclick="window.toggleAuthMode()">
            <span id="switchText">🔄 Pas de compte ? S'inscrire</span>
        </div>
    </div>
</div>

<div id="gameModal" class="modal">
    <div class="modal-content">
        <h2>🎲 JEU FLASH</h2>
        <p>💰 500 CFA pour jouer → <span style="color:#2ecc71;">Gagnez +140%</span> | <span style="color:#e74c3c;">Perdez -50%</span></p>
        <div id="gameArea">
            <div style="font-size:2rem; margin:20px;">🎯</div>
            <button class="confirm-btn" onclick="window.winGame()">🏆 GAGNER (140%)</button>
            <button class="close-modal" onclick="window.loseGame()">😞 PERDRE (50%)</button>
        </div>
        <button class="close-modal" onclick="window.closeGameModal()">Fermer</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCxsXpj3ovdd2Wu5HNHN1Zyvf7qG00aXx4",
        authDomain: "dubai-dbd3f.firebaseapp.com",
        databaseURL: "https://dubai-dbd3f-default-rtdb.firebaseio.com",
        projectId: "dubai-dbd3f",
        storageBucket: "dubai-dbd3f.firebasestorage.app",
        messagingSenderId: "543622740538",
        appId: "1:543622740538:web:0e4e6abf3124a878dad303"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    
    let currentUser = null;
    let currentUserData = null;
    let products = [];
    let userInventory = [];
    let currentTab = 'market';
    let searchTerm = '';
    let currentPage = 1;
    const itemsPerPage = 20;
    let activeGameItem = null;

    // GÉNÉRATION 100 PRODUITS
    function generateProductList() {
        const categories = ["Or", "Diamant", "Crypto", "Immobilier", "Voiture", "Moto", "Montre", "Smartphone", "PC Gamer", "Console"];
        const emojis = {"Or":"🪙","Diamant":"💎","Crypto":"₿","Immobilier":"🏠","Voiture":"🚗","Moto":"🏍️","Montre":"⌚","Smartphone":"📱","PC Gamer":"💻","Console":"🎮"};
        let list = [];
        for (let i = 0; i < 100; i++) {
            let cat = categories[i % categories.length];
            let productNum = Math.floor(i / categories.length) + 1;
            let price = [500, 1000, 1500, 2000, 2500][i % 5];
            list.push({
                id: i + 1,
                name: `${cat} ${productNum}`,
                category: cat,
                emoji: emojis[cat] || "📦",
                currentPrice: price,
                isAvailable: true,
                ownerId: null
            });
        }
        return list;
    }

    async function buyProduct(productId) {
        if (!currentUserData) return;
        const product = products.find(p => p.id === productId);
        if (!product || !product.isAvailable) { showMessage("Produit indisponible", "error"); return; }
        if (currentUserData.balance < product.currentPrice) { showMessage("Solde insuffisant", "error"); return; }
        
        currentUserData.balance -= product.currentPrice;
        await database.ref(`users/${currentUser.uid}`).update({ balance: currentUserData.balance });
        
        const updatedProducts = products.map(p => p.id === productId ? { ...p, isAvailable: false, ownerId: currentUser.uid } : p);
        await database.ref('products').set(updatedProducts);
        
        const newItem = {
            id: Date.now(),
            productId: product.id,
            productName: product.name,
            productEmoji: product.emoji,
            purchasePrice: product.currentPrice,
            purchaseDate: new Date().toISOString(),
            played: false  // ← important: correspond à votre champ "played"
        };
        await database.ref(`inventory/${currentUser.uid}`).push(newItem);
        showMessage(`✅ Achat réussi : ${product.name}`, "success");
        await refreshUserInventory();
        renderApp();
    }

    async function playGame(itemId) {
        // Conversion explicite en nombre car votre ID Firebase est un nombre
        const item = userInventory.find(i => i.id == Number(itemId));
        if (!item) {
            showMessage("❌ Produit non trouvé (ID: "+itemId+")", "error");
            console.log("Inventory:", userInventory);
            console.log("Recherché:", itemId);
            return;
        }
        if (item.played === true) {
            showMessage("⏰ Vous avez déjà joué avec ce produit !", "error");
            return;
        }
        if (currentUserData.balance < 500) {
            showMessage("❌ 500 CFA requis", "error");
            return;
        }
        
        currentUserData.balance -= 500;
        await database.ref(`users/${currentUser.uid}`).update({ balance: currentUserData.balance });
        
        activeGameItem = item;
        document.getElementById('gameModal').classList.add('active');
        renderApp();
    }

    async function winGame() {
        if (!activeGameItem) return;
        const gain = Math.floor(activeGameItem.purchasePrice * 1.4);
        currentUserData.balance += gain;
        
        await database.ref(`users/${currentUser.uid}`).update({ balance: currentUserData.balance });
        await database.ref(`inventory/${currentUser.uid}/${activeGameItem.id}`).update({ played: true });
        
        showMessage(`🏆 VICTOIRE ! +${gain.toLocaleString()} CFA (140%)`, "success");
        closeGameModal();
        await refreshUserInventory();
        renderApp();
    }

    async function loseGame() {
        if (!activeGameItem) return;
        const loseAmount = Math.floor(activeGameItem.purchasePrice * 0.5);
        // On ne retire que la valeur du produit virtuellement, pas le solde réel
        showMessage(`😞 PERDU ! Le produit ${activeGameItem.productName} perd 50% de sa valeur (${loseAmount.toLocaleString()} CFA)`, "error");
        await database.ref(`inventory/${currentUser.uid}/${activeGameItem.id}`).update({ played: true });
        closeGameModal();
        await refreshUserInventory();
        renderApp();
    }

    function closeGameModal() {
        document.getElementById('gameModal').classList.remove('active');
        activeGameItem = null;
    }

    async function refreshUserInventory() {
        const snap = await database.ref(`inventory/${currentUser.uid}`).once('value');
        userInventory = snap.exists() ? Object.values(snap.val()) : [];
        console.log("Inventaire chargé:", userInventory);
    }

    function renderApp() {
        if (!currentUserData) return;
        
        let available = products.filter(p => p.isAvailable === true);
        if (searchTerm) available = available.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));
        const paginated = available.slice((currentPage-1)*itemsPerPage, currentPage*itemsPerPage);
        const totalPages = Math.ceil(available.length / itemsPerPage);
        
        let content = `<div class="container">
            <div class="header">
                <div class="logo"><h1>⭐ STAR GAME 140%</h1><p>📦 100 produits | Jeu 500 CFA</p></div>
                <div class="user-info">
                    <span class="username">👤 ${currentUserData.username}</span>
                    <span class="balance">💰 ${currentUserData.balance.toLocaleString()} CFA</span>
                    <button class="support-btn" onclick="window.contactSupport()">📞 97413067</button>
                    <button class="deposit-btn" onclick="window.openDepositModal()">➕ Dépôt</button>
                    <button class="withdraw-btn" onclick="window.openWithdrawModal()">💸 Retrait</button>
                    <button class="logout-btn" onclick="window.logout()">🚪 Exit</button>
                </div>
            </div>
            <div class="tabs">
                <button class="tab-btn ${currentTab==='market'?'active':''}" onclick="window.switchTab('market')">🛍️ Marché (${available.length})</button>
                <button class="tab-btn ${currentTab==='inventory'?'active':''}" onclick="window.switchTab('inventory')">📦 Mes produits (${userInventory.length})</button>
            </div>`;
        
        if (currentTab === 'market') {
            content += `<div class="search-bar"><input placeholder="🔍 Rechercher..." onkeyup="window.updateSearch(this.value)"></div>
            <div class="products-grid">${paginated.map(p => `
                <div class="product-card">
                    <div class="product-emoji">${p.emoji}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.currentPrice.toLocaleString()} CFA</div>
                    <button class="buy-btn" onclick="window.buyProduct(${p.id})">✔️ Acheter</button>
                </div>`).join('')}</div>
                ${totalPages > 1 ? `<div style="text-align:center; margin-top:15px;">${Array.from({length:Math.min(totalPages,5)},(_,i)=>`<button class="page-btn" onclick="window.goToPage(${i+1})" style="margin:2px;padding:4px 10px;">${i+1}</button>`).join('')}</div>` : ''}`;
        } else {
            if (userInventory.length === 0) {
                content += `<div class="loading" style="text-align:center;padding:40px;">🌟 Aucun produit acheté</div>`;
            } else {
                userInventory.forEach(item => {
                    content += `<div class="inventory-item">
                        <div>
                            <strong>${item.productEmoji} ${item.productName}</strong><br>
                            💰 Prix d'achat: ${item.purchasePrice.toLocaleString()} CFA<br>
                            ${!item.played ? '<span class="pending-badge">🎮 En attente de jeu</span>' : '<span style="background:#2c3e50;padding:2px 10px;border-radius:20px;">✅ Déjà joué</span>'}
                        </div>
                        <div>
                            ${!item.played ? `<button class="play-game-btn" onclick="window.playGame(${item.id})">🎮 Jouer (500 CFA)<br><span style="font-size:0.6rem;">Gagnez 140% | Perdez 50%</span></button>` : `<button style="background:#555;padding:8px 16px;border-radius:30px;border:none;color:white;" disabled>🔒 Terminé</button>`}
                        </div>
                    </div>`;
                });
            }
        }
        content += `</div>`;
        document.getElementById('app').innerHTML = content;
    }

    function goToPage(page) { currentPage = page; renderApp(); }

    function startApp() {
        database.ref('products').once('value', (snap) => { if (!snap.exists()) database.ref('products').set(generateProductList()); });
        database.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            products = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
            renderApp();
        });
        database.ref(`inventory/${currentUser.uid}`).on('value', async (snapInv) => {
            userInventory = snapInv.exists() ? Object.values(snapInv.val()) : [];
            renderApp();
        });
        renderApp();
    }

    async function login() {
        let phone = document.getElementById('loginPhone').value.trim();
        let password = document.getElementById('loginPassword').value;
        if (!phone || phone.length !== 8) { showMessage("Numéro 8 chiffres", "error"); return; }
        const email = `${phone}@stargame.com`;
        try {
            const result = await auth.signInWithEmailAndPassword(email, password);
            currentUser = result.user;
            await loadUserData();
            document.getElementById('authModal').classList.remove('active');
            startApp();
            showMessage(`✅ Bonjour ${currentUserData.username} !`, "success");
        } catch(error) { showMessage("Erreur connexion", "error"); }
    }

    async function signup() {
        let name = document.getElementById('signupName').value.trim();
        let phone = document.getElementById('signupPhone').value.trim();
        let password = document.getElementById('signupPassword').value;
        if (!name || name.length < 3) { showMessage("Nom min 3 caractères", "error"); return; }
        if (!phone || phone.length !== 8) { showMessage("Numéro 8 chiffres", "error"); return; }
        if (!password || password.length !== 8) { showMessage("Mot de passe 8 caractères", "error"); return; }
        const email = `${phone}@stargame.com`;
        try {
            const result = await auth.createUserWithEmailAndPassword(email, password);
            currentUser = result.user;
            await database.ref(`users/${currentUser.uid}`).set({ username: name, phone: phone, balance: 1000, createdAt: new Date().toISOString() });
            currentUserData = { username: name, phone: phone, balance: 1000 };
            document.getElementById('authModal').classList.remove('active');
            startApp();
            showMessage("✅ Inscription réussie ! 1000 CFA offerts", "success");
        } catch(error) { showMessage("Erreur inscription", "error"); }
    }

    async function loadUserData() {
        const snap = await database.ref(`users/${currentUser.uid}`).once('value');
        if (snap.exists()) currentUserData = snap.val();
    }

    function showMessage(msg, type) { let div = document.createElement('div'); div.className = `message message-${type}`; div.innerText = msg; document.body.appendChild(div); setTimeout(() => div.remove(), 3000); }
    function toggleAuthMode() { const l=document.getElementById('loginForm'), s=document.getElementById('signupForm'), t=document.getElementById('switchText'); if(l.style.display!=='none'){l.style.display='none';s.style.display='block';t.innerText='🔄 Déjà un compte ? Se connecter'}else{l.style.display='block';s.style.display='none';t.innerText='🔄 Pas de compte ? S\'inscrire'} }
    async function logout() { await auth.signOut(); currentUser=null; currentUserData=null; document.getElementById('authModal').classList.add('active'); document.getElementById('app').innerHTML=''; }
    function switchTab(t) { currentTab = t; currentPage = 1; renderApp(); }
    function updateSearch(v) { searchTerm = v; currentPage = 1; renderApp(); }
    function contactSupport() { window.location.href = "tel:97413067"; }
    function openDepositModal() { showMessage("📞 Contactez +97413067 pour déposer", "success"); }
    function openWithdrawModal() { showMessage("📞 Contactez +97413067 pour retirer", "success"); }

    window.login = login; window.signup = signup; window.toggleAuthMode = toggleAuthMode;
    window.buyProduct = buyProduct; window.playGame = playGame;
    window.winGame = winGame; window.loseGame = loseGame; window.closeGameModal = closeGameModal;
    window.switchTab = switchTab; window.updateSearch = updateSearch; window.goToPage = goToPage;
    window.contactSupport = contactSupport; window.openDepositModal = openDepositModal; window.openWithdrawModal = openWithdrawModal; window.logout = logout;

    auth.onAuthStateChanged(async (user) => {
        if (user) { currentUser = user; await loadUserData(); if (currentUserData) { document.getElementById('authModal').classList.remove('active'); startApp(); } }
    });
</script>
</body>
    </html>
